<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>디지털 휴먼 — 실시간으로 살아 움직이는 3D 인물</title>
<meta name="description" content="브라우저에서 실시간으로 숨 쉬고, 눈을 깜빡이고, 당신을 바라보며 말하는 3D 디지털 휴먼. 표정 바꾸기, 한국어 립싱크, 사진·영상 저장까지 설치 없이.">
<link rel="canonical" href="https://richroro.github.io/human/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="디지털 휴먼">
<meta property="og:title" content="디지털 휴먼 — 실시간으로 살아 움직이는 3D 인물">
<meta property="og:description" content="숨 쉬고, 깜빡이고, 눈을 맞추고, 한국어로 말합니다. 브라우저에서 바로 보고 사진·영상으로 저장하세요.">
<meta property="og:url" content="https://richroro.github.io/human/">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="https://richroro.github.io/human/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://richroro.github.io/human/og.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23161412'/><circle cx='50' cy='42' r='18' fill='%23e8c9b0'/><path d='M22 86c4-17 15-25 28-25s24 8 28 25' fill='%23e8c9b0'/></svg>">
<link rel="preload" href="assets/avatar.glb?v=6" as="fetch" crossorigin>
<style>
  :root {
    --bg: #121110; --ink: #f4efe9; --muted: #b4aaa0; --line: rgba(255,255,255,.12);
    --glass: rgba(22,20,18,.58); --chip: rgba(255,255,255,.08); --accent: #ffb88a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .top a, .top button { pointer-events: auto; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
  .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .home { color: var(--muted); text-decoration: none; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #ff5a4f; box-shadow: 0 0 0 0 rgba(255,90,79,.6); animation: pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(255,90,79,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,79,0); } }

  .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: min(720px, calc(100% - 24px));
    background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 12px; backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    display: grid; gap: 10px; transition: opacity .35s, transform .35s; }
  body.clean .panel, body.clean .top { opacity: 0; pointer-events: none; }
  body.clean .panel { transform: translate(-50%, 16px); }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .row::-webkit-scrollbar { display: none; }
  .chip, .tool, .line { flex: none; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .2s, border-color .2s, color .2s; }
  .chip:hover, .tool:hover, .line:hover { background: rgba(255,255,255,.14); }
  .chip.on { background: var(--ink); color: #191512; border-color: var(--ink); font-weight: 600; }
  .line { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); border-radius: 14px; padding: 11px 14px; font: inherit; outline: none; }
  input[type=text]:focus { border-color: rgba(255,184,138,.6); }
  input::placeholder { color: #8d847b; }
  .say { border: 0; border-radius: 14px; padding: 0 18px; font: inherit; font-weight: 700; background: var(--accent); color: #2a1609; cursor: pointer; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tool { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 7px 12px; }
  .tool svg { width: 15px; height: 15px; }
  .tool.toggle:not(.on) { color: var(--muted); }
  .tool.toggle.on { border-color: rgba(255,184,138,.55); }
  #rec.on { background: #ff5a4f; border-color: #ff5a4f; color: #fff; }
  .credit { font-size: 11px; color: #8d847b; margin-left: auto; align-self: center; }
  .credit a { color: inherit; }

  #toast { position: fixed; left: 50%; bottom: 210px; transform: translate(-50%, 8px); background: rgba(20,18,16,.85); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 13.5px; opacity: 0; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 560px) { #toast { bottom: 160px; } }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .8s; z-index: 5; }
  #loading.done { opacity: 0; pointer-events: none; }
  .ld { width: min(280px, 70vw); text-align: center; }
  .ld p { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .bar { height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  #loadbar { height: 100%; width: 3%; background: var(--accent); transition: width .3s; }

  @media (max-width: 560px) {
    .panel { padding: 10px; gap: 8px; border-radius: 18px; }
    .credit { display: none; }
    .tool span { display: none; }
    .tool { padding: 8px 11px; }
    .lines-row { display: none; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .lines-row, .tools-extra { display: none; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="실시간 3D 디지털 휴먼"></canvas>

<div class="top">
  <a class="home" href="/">&larr; 홈</a>
  <div class="brand">디지털 휴먼<small>실시간 렌더링 · 녹화 아님</small></div>
  <div class="live"><i></i>LIVE</div>
</div>

<div class="panel">
  <div class="row" id="moods" aria-label="표정"></div>
  <form id="sayform">
    <input id="text" type="text" maxlength="300" placeholder="하고 싶은 말을 적으면 그대로 말해요" autocomplete="off" enterkeyhint="send">
    <button class="say" type="submit">말하기</button>
  </form>
  <div class="row lines-row" id="lines"></div>
  <div class="tools">
    <button class="tool" id="shot" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>사진 저장</span></button>
    <button class="tool" id="rec" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg><span>영상 녹화</span></button>
    <button class="tool toggle on" id="follow" type="button" title="마우스·손가락을 눈으로 따라가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>시선 따라오기</span></button>
    <button class="tool toggle on tools-extra" id="hand" type="button" title="손으로 든 카메라처럼 미세하게 흔들기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h13v10H3zM16 10l5-3v10l-5-3"/></svg><span>핸드헬드</span></button>
    <button class="tool tools-extra" id="q" type="button">화질: 높음</button>
    <button class="tool" id="hide" type="button" title="화면만 보기 (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>화면만</span></button>
    <span class="credit">인물·모션 <a href="https://github.com/microsoft/Microsoft-Rocketbox" target="_blank" rel="noopener">Microsoft Rocketbox</a>(MIT) · <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a></span>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="loading">
  <div class="ld">
    <div class="bar"><div id="loadbar"></div></div>
    <p id="loadmsg">인물을 깨우는 중…</p>
  </div>
</div>

<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">이 페이지는 자바스크립트와 WebGL이 필요합니다.</p></noscript>
<script type="module" src="app.js?v=6"></script>
</body>
</html>
