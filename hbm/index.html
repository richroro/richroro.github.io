<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070e">
<title>HBM 해부 · 쌓인 메모리를 뜯어 보기</title>
<meta name="description" content="GPU 옆에 붙는 HBM 을 3D 로 분해합니다. 인터포저·베이스 다이·DRAM 적층·TSV·마이크로범프가 어떻게 겹쳐 있고, 왜 옆으로 넓히지 않고 위로 쌓는지 눌러 가며 봅니다.">
<link rel="canonical" href="https://richroro.github.io/hbm/">
<meta property="og:type" content="website"><meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="Cadence">
<meta property="og:url" content="https://richroro.github.io/hbm/">
<meta property="og:title" content="HBM 해부 — 쌓인 메모리를 뜯어 보기">
<meta property="og:description" content="인터포저부터 TSV 까지, 슬라이더를 끌면 층이 뜹니다. 대역폭을 속도가 아니라 폭으로 버는 이유를 눈으로 봅니다.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314161C'/><rect x='24' y='58' width='52' height='9' rx='2' fill='%23d98b52'/><rect x='24' y='44' width='52' height='9' rx='2' fill='%238fa9d6'/><rect x='24' y='30' width='52' height='9' rx='2' fill='%238fa9d6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --ink:#eef3fb; --dim:#93a3bd; --line:rgba(255,255,255,.13);
    --glass:rgba(8,13,22,.7); --glass2:rgba(13,19,31,.92);
    --acc:#6fb4ff; --cu:#e2a06a; --pad:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#04070e}
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--ink);letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}
  .lab{position:absolute;top:0;left:0;white-space:nowrap;font-size:11.5px;font-weight:600;color:#a7bcd8;
    padding:3px 7px;border-radius:6px;background:rgba(6,10,18,.66);border:1px solid rgba(255,255,255,.1);
    text-shadow:0 1px 6px #000;transition:color .2s,border-color .2s}
  .lab.on{color:#dbeaff;border-color:rgba(111,180,255,.5);background:rgba(16,33,56,.82)}

  .ui{position:fixed;z-index:10}
  #top{top:max(var(--pad),env(safe-area-inset-top));left:max(var(--pad),env(safe-area-inset-left));max-width:min(52vw,400px)}
  #top h1{font-size:clamp(17px,2.2vw,22px);font-weight:700;letter-spacing:-.6px;text-shadow:0 2px 18px #000}
  #top p{margin-top:6px;font-size:12px;color:var(--dim);line-height:1.55;text-shadow:0 1px 10px #000}

  #panel{left:max(var(--pad),env(safe-area-inset-left));bottom:max(var(--pad),env(safe-area-inset-bottom));
    width:272px;border:1px solid var(--line);border-radius:14px;background:var(--glass);
    backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);overflow:hidden;box-shadow:0 22px 50px -22px #000}
  #panel .head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer}
  #panel .head b{font-size:12px}
  #panel .head span{font-size:11px;color:var(--dim);font-family:"IBM Plex Mono",monospace}
  #panel.closed .body{display:none}
  #panel .body{padding:6px 13px 13px;border-top:1px solid rgba(255,255,255,.07)}
  .grp{margin-top:11px}
  .grp>label{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:6px}
  .grp>label i{font-style:normal;color:var(--ink);font-family:"IBM Plex Mono",monospace}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--acc);margin-top:-5.5px;box-shadow:0 0 0 4px rgba(111,180,255,.16)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 4px rgba(111,180,255,.16)}
  .gens{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .gen{padding:7px 2px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--dim);font-size:10.5px;font-weight:700;font-family:"IBM Plex Mono",monospace;cursor:pointer}
  .gen.on{background:rgba(111,180,255,.14);border-color:rgba(111,180,255,.5);color:#cfe4ff}
  .togs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}
  .tg{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);font-size:11px;font-weight:600;color:var(--dim);cursor:pointer;font-family:inherit}
  .tg .d{width:6px;height:6px;border-radius:50%;background:#46536b;flex:none}
  .tg.on{color:var(--ink);border-color:rgba(111,180,255,.45);background:rgba(111,180,255,.1)}
  .tg.on .d{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  #spec{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);
    display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px}
  #spec dt{color:var(--dim)}
  #spec dd{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  #spec .src{grid-column:1/-1;margin-top:6px;font-size:10.5px;color:#6d7a90;line-height:1.5;text-align:left}

  #tour{right:max(var(--pad),env(safe-area-inset-right));top:max(var(--pad),env(safe-area-inset-top));width:296px;
    border:1px solid var(--line);border-radius:14px;background:var(--glass2);backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);padding:14px;box-shadow:0 22px 50px -22px #000}
  #tour .step{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-family:"IBM Plex Mono",monospace}
  #tour h2{margin-top:8px;font-size:15px;font-weight:700}
  #tour p{margin-top:8px;font-size:12.5px;line-height:1.65;color:#bccbe2}
  #tour .btns{display:flex;gap:6px;margin-top:12px}
  #tour button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  #tour button:hover{background:rgba(255,255,255,.11)}
  #tour button.main{background:rgba(111,180,255,.15);border-color:rgba(111,180,255,.45);color:#cfe4ff}
  #tour button:disabled{opacity:.35;cursor:default}

  #card{right:max(var(--pad),env(safe-area-inset-right));bottom:max(var(--pad),env(safe-area-inset-bottom));
    width:296px;border:1px solid var(--line);border-radius:14px;background:var(--glass2);
    backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);padding:14px;box-shadow:0 22px 50px -22px #000;
    opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
  #card.on{opacity:1;transform:none}
  #card h3{font-size:14.5px;font-weight:700}
  #card h3 small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);font-weight:500;margin-top:2px}
  #card p{margin-top:9px;font-size:12.5px;line-height:1.65;color:#bccbe2}
  #card .note{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8fa0bb}

  #boot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#04070e;transition:opacity .45s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot p{font-size:12px;color:var(--dim)}
  #boot .sp{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:2px solid rgba(111,180,255,.2);
    border-top-color:var(--acc);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #nogl{display:none;max-width:430px;text-align:center;padding:24px;font-size:13px;line-height:1.7;color:var(--dim)}
  #nogl b{display:block;color:var(--ink);font-size:15px;margin-bottom:9px}

  @media (max-width:860px){
    :root{--pad:11px}
    #top{max-width:calc(100vw - 22px)}
    #panel,#card,#tour{width:calc(100vw - 22px);max-width:340px}
    #tour{top:auto;bottom:calc(env(safe-area-inset-bottom) + 58px);right:11px}
    #card{bottom:calc(env(safe-area-inset-bottom) + 58px)}
  }
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<div id="labels"></div>

<div class="ui" id="top">
  <h1>HBM 해부</h1>
  <p>GPU 옆에 붙는 쌓인 메모리를 뜯어 봅니다. 아래 슬라이더를 끌면 층이 뜨고,
     조각을 짚으면 그게 무엇을 하는지 나옵니다.</p>
</div>

<div class="ui" id="panel">
  <div class="head" id="head"><b>분해와 세대</b><span id="stat">—</span></div>
  <div class="body">
    <div class="grp">
      <label>분해 <i id="vEx">0%</i></label>
      <input type="range" id="sEx" min="0" max="100" value="0">
    </div>
    <div class="grp">
      <label>세대 <i id="vGen">HBM3E</i></label>
      <div class="gens" id="gens"></div>
    </div>
    <div class="togs">
      <button class="tg on" id="tLabel"><span class="d"></span>이름표</button>
      <button class="tg on" id="tRotate"><span class="d"></span>자동 회전</button>
    </div>
    <dl id="spec"></dl>
  </div>
</div>

<div class="ui" id="tour">
  <div class="step"><span id="tStep">해설</span></div>
  <h2 id="tTitle">쌓아서 가까이</h2>
  <p id="tBody">HBM 은 메모리를 옆으로 늘어놓는 대신 위로 쌓아, 연산 칩 바로 옆에 붙인 것입니다.
     다섯 걸음으로 왜 이렇게 생겼는지 보여 드릴게요.</p>
  <div class="btns">
    <button id="tPrev" disabled>‹ 이전</button>
    <button id="tNext" class="main">해설 시작 ›</button>
  </div>
</div>

<div class="ui" id="card">
  <h3 id="cKo">—<small id="cEn"></small></h3>
  <p id="cDesc"></p>
  <div class="note" id="cNote"></div>
</div>

<div id="boot">
  <div class="in" id="bootIn"><div class="sp"></div><p>층을 쌓는 중…</p></div>
  <div id="nogl">
    <b>WebGL2 를 쓸 수 없습니다</b>
    이 페이지는 브라우저의 3D 가속이 필요합니다. 최신 크롬·사파리·엣지에서 열어 주세요.
  </div>
</div>

<script type="module">
import { createHBM, PARTS, GENS } from './assets/hbm.js';

const $ = (s) => document.querySelector(s);
let app = null, bootErr = null;
try {
  app = createHBM($('#c'), {
    labelHost: $('#labels'), gen: 'hbm3e',
    onHover: showCard,
    onPick: (part) => { if (part) { showCard(part); pinned = part; } },
  });
} catch (e) { bootErr = e; console.error(e); }

let pinned = null;
function showCard(part) {
  const card = $('#card');
  const p = part && PARTS[part];
  if (!p) { if (!pinned) card.classList.remove('on'); return; }
  $('#cKo').firstChild.textContent = p.ko;
  $('#cEn').textContent = p.en;
  $('#cDesc').textContent = p.desc;
  $('#cNote').textContent = p.note;
  card.classList.add('on');
}

if (!app) {
  const hasGL2 = (() => { try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; } })();
  if (hasGL2 && bootErr) $('#nogl').innerHTML = '<b>화면을 시작하지 못했습니다</b>브라우저 콘솔에 오류가 찍혀 있습니다.';
  $('#bootIn').style.display = 'none';
  $('#nogl').style.display = 'block';
  document.querySelectorAll('.ui').forEach((el) => el.remove());
} else {
  window.__hbm = app;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('#boot').classList.add('gone');
    setTimeout(() => $('#boot').remove(), 500);
  }));

  /* 분해 */
  const sEx = $('#sEx');
  const syncEx = () => { const v = sEx.value / 100; app.setExplode(v); $('#vEx').textContent = Math.round(v * 100) + '%'; };
  sEx.addEventListener('input', syncEx);

  /* 세대 */
  const gens = $('#gens');
  gens.innerHTML = Object.entries(GENS).map(([k, g]) =>
    `<button class="gen${k === app.gen ? ' on' : ''}" data-k="${k}">${g.label.replace('HBM', '')}</button>`).join('');
  gens.addEventListener('click', (e) => {
    const b = e.target.closest('.gen'); if (!b) return;
    app.setGen(b.dataset.k);
    gens.querySelectorAll('.gen').forEach((x) => x.classList.toggle('on', x === b));
    spec();
  });
  function spec() {
    const g = GENS[app.gen];
    $('#vGen').textContent = g.label;
    $('#stat').textContent = g.dies + '단 · ' + g.bus + 'bit';
    $('#spec').innerHTML =
      `<dt>인터페이스 폭</dt><dd>${g.bus} bit</dd>` +
      `<dt>핀당 속도</dt><dd>${g.pin} Gbps</dd>` +
      `<dt>스택당 대역폭</dt><dd>${g.bw}</dd>` +
      `<dt>최대 적층</dt><dd>${g.high}</dd>` +
      `<dt>스택당 최대 용량</dt><dd>${g.cap}</dd>` +
      `<dt>표준 공개</dt><dd>${g.year}</dd>` +
      `<div class="src">JEDEC 표준 기준값입니다. 제조사별 실제 출하 제품과 점유율·가격 같은 움직이는 숫자는 싣지 않았습니다.</div>`;
  }
  spec();

  /* 토글 */
  const tog = (sel, fn) => $(sel).addEventListener('click', () => {
    const on = !$(sel).classList.contains('on');
    $(sel).classList.toggle('on', on); fn(on);
  });
  tog('#tLabel', (v) => app.setLabels(v));
  tog('#tRotate', (v) => app.setAutoRotate(v));
  $('#head').addEventListener('click', () => $('#panel').classList.toggle('closed'));
  if (matchMedia('(max-width:860px)').matches) $('#panel').classList.add('closed');

  /* 해설 */
  let step = -1;
  const render = () => {
    const st = app.tour[step];
    $('#tStep').textContent = step < 0 ? '해설' : `해설 ${step + 1} / ${app.tour.length}`;
    $('#tPrev').disabled = step < 0;
    if (st) {
      $('#tTitle').textContent = st.title;
      $('#tBody').textContent = st.body;
      sEx.value = Math.round(st.explode * 100); syncEx();
    }
    $('#tNext').textContent = step < 0 ? '해설 시작 ›' : (step >= app.tour.length - 1 ? '처음으로' : '다음 ›');
  };
  $('#tNext').addEventListener('click', () => {
    step = step >= app.tour.length - 1 ? -1 : step + 1;
    if (step < 0) { app.clearTour(); app.resetView(); $('#tTitle').textContent = '쌓아서 가까이';
      $('#tBody').textContent = 'HBM 은 메모리를 옆으로 늘어놓는 대신 위로 쌓아, 연산 칩 바로 옆에 붙인 것입니다. 다섯 걸음으로 왜 이렇게 생겼는지 보여 드릴게요.';
      sEx.value = 0; syncEx(); render(); return; }
    const st = app.goTour(step); if (st) showCard(st.part);
    render();
  });
  $('#tPrev').addEventListener('click', () => {
    step = Math.max(-1, step - 1);
    if (step < 0) { app.clearTour(); app.resetView(); }
    else { const st = app.goTour(step); if (st) showCard(st.part); }
    render();
  });

  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 'r') app.resetView();
    else if (k === 'l') $('#tLabel').click();
    else if (k === 'arrowright') $('#tNext').click();
    else if (k === 'arrowleft') $('#tPrev').click();
  });
}
</script>
</body>
</html>
