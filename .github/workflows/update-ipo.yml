name: 공모주 일정 자동 갱신

# 38커뮤니케이션 공개 표(청약 일정·수요예측·신규상장·종목 상세)를 읽어 ipo/data/ipo.json 으로 커밋한다.
# 페이지(https://richroro.github.io/ipo/)는 열릴 때 이 파일 하나를 읽는다. 인증키가 필요 없다.

on:
  schedule:
    # 평일 07:10 KST(그날 일정) · 12:10 KST(오전에 나온 수요예측 결과) · 17:10 KST(청약 마감 뒤 경쟁률·상장 첫날 시세)
    - cron: '10 22 * * 0-4'
    - cron: '10 3,8 * * 1-5'
  workflow_dispatch:
    inputs:
      pages:
        description: '표마다 몇 쪽까지 읽을지 (쪽당 약 20종목, 비우면 3)'
        required: false
        type: string
      detail_limit:
        description: '상세 페이지를 몇 곳까지 읽을지 (비우면 40)'
        required: false
        type: string

concurrency:
  group: ipo-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 만들기
        env:
          PAGES: ${{ inputs.pages }}
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$PAGES" ]; then args+=(--pages "$PAGES"); fi
          if [ -n "$DETAIL_LIMIT" ]; then args+=(--detail-limit "$DETAIL_LIMIT"); fi
          python ipo/build.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          { echo "### 공모주 일정"; echo '```'; tail -n 12 "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 데이터 검사
        run: |
          set -o pipefail
          git show HEAD:ipo/data/ipo.json > "$RUNNER_TEMP/prev.json" 2>/dev/null || true
          python ipo/validate.py --min-items 5 --prev "$RUNNER_TEMP/prev.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 바뀐 게 있으면 커밋
        run: |
          # 갱신 시각(updated·asof)만 바뀐 경우는 커밋하지 않는다
          strip='import json,sys; d=json.load(open(sys.argv[1])); [d.pop(k,None) for k in ("updated","asof")]; print(json.dumps(d,sort_keys=True,ensure_ascii=False))'
          if [ -z "$(git status --porcelain -- ipo/data)" ] || \
             [ "$(python -c "$strip" "$RUNNER_TEMP/prev.json" 2>/dev/null)" = "$(python -c "$strip" ipo/data/ipo.json)" ]; then
            echo "내용 변경 없음 — 커밋하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ipo/data
          git commit -m "공모주 일정 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            echo "푸시 실패, 재시도 $i"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep $((2 ** i))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::커밋은 만들었지만 푸시하지 못했습니다. 다음 실행에서 다시 시도합니다."
            exit 1
          fi
