name: 공모주 일정 자동 갱신

# 38커뮤니케이션 공개 표(청약 일정·수요예측·신규상장·종목 상세)를 읽어 ipo/data/ipo.json 으로 커밋한다.
# 페이지(https://richroro.github.io/ipo/)는 열릴 때 이 파일 하나를 읽는다. 인증키가 필요 없다.

on:
  schedule:
    # 평일 07:10 KST(그날 일정) · 17:10 KST(청약 마감 뒤 경쟁률·상장 첫날 시세)
    - cron: '10 22 * * 0-4'
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ipo-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 만들기
        run: |
          set -o pipefail
          python ipo/build.py 2>&1 | tee "$RUNNER_TEMP/build.log"
          { echo "### 공모주 일정"; echo '```'; tail -n 12 "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 데이터 검사
        run: |
          set -o pipefail
          python ipo/validate.py --min-items 5 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain -- ipo/data)" ]; then
            echo "변경 없음 — 커밋하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ipo/data
          git commit -m "공모주 일정 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            echo "푸시 실패, 재시도 $i"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::커밋은 만들었지만 푸시하지 못했습니다. 다음 실행에서 다시 시도합니다."
            exit 1
          fi
