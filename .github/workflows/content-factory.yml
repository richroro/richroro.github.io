name: 콘텐츠 공장

# content-factory/ideas/*.md 에 아이디어 메모가 올라오면 Claude API 로 블로그·뉴스레터·유튜브·쇼츠·SNS 원고를 만들고
# 블로그(/blog/)·RSS(/blog/feed.xml)·대시보드(/content-factory/)를 갱신해 커밋한다.
# 저장소 Settings → Secrets and variables → Actions 에 ANTHROPIC_API_KEY 가 있어야 생성된다(없으면 렌더만).
# 같은 화면 Variables 에 FACTORY_GA4_ID(G-XXXX) 를 넣으면 블로그에 GA4 가 붙는다(⑥ 분석).

on:
  push:
    branches: [main]
    paths: ['content-factory/ideas/**']
  workflow_dispatch:
    inputs:
      only:
        description: '이 아이디어(파일 이름, .md 뺀 것)만 다시 생성. 비우면 아직 원고가 없는 것 전부'
        required: false
        type: string

concurrency:
  group: content-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비 (SDK · 썸네일용 Pillow · 한글 글꼴)
        run: |
          pip install anthropic pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: 원고 생성·렌더
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_GA4_ID: ${{ vars.FACTORY_GA4_ID }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python content-factory/factory.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/factory.log"
          { echo "### 콘텐츠 공장"; echo '```'; tail -n 20 "$RUNNER_TEMP/factory.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain -- blog content-factory/out sitemap.xml)" ]; then
            echo "변경 없음 — 커밋하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog content-factory/out sitemap.xml
          git commit -m "콘텐츠 공장 원고 생성 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "푸시 실패, 재시도 $i"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep $((2 ** i))
          done
          echo "::error::커밋은 만들었지만 푸시하지 못했습니다."
          exit 1
