name: 실거래가 자동 수집

# 국토교통부 실거래가 API 로 아파트 매매 자료를 받아 real-estate/data/latest.json 으로 커밋한다.
# 페이지(https://richroro.github.io/real-estate/)는 열릴 때 이 파일을 자동으로 읽는다.
#
# 준비물: 공공데이터포털(data.go.kr)에서 "국토교통부_아파트 매매 실거래가 상세 자료" 와
#         (전세가율을 보려면) "국토교통부_아파트 전월세 자료" 를 활용신청 후
#         발급받은 인증키를 저장소 Settings → Secrets and variables → Actions 에
#         DATA_GO_KR_KEY 라는 이름으로 등록.
# 수집 지역·기간은 real-estate/regions.json 에서 바꾼다.

on:
  schedule:
    - cron: '10 21 * * *'   # 매일 06:10 KST (실거래가는 하루 단위로 갱신된다)
  workflow_dispatch:
    inputs:
      months:
        description: '최근 몇 개월치를 받을지 (비우면 regions.json 값)'
        required: false
        type: string
      lawd:
        description: '이번 실행만 특정 시군구 코드로 (쉼표 구분, 비우면 regions.json 전체)'
        required: false
        type: string

concurrency:
  group: real-estate-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 키가 없을 때 예약 실행까지 빨갛게 실패하면 매일 알림이 옵니다. 매일 오는 실패는
      # 곧 안 보게 되므로, 예약 실행은 건너뛰고(초록) 사람이 직접 돌린 실행만 실패시킵니다.
      # 어느 쪽이든 이유와 등록 방법은 실행 요약에 남습니다.
      - name: 인증키 확인
        id: key
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "### 건너뜀 — 인증키가 없습니다"
            echo
            echo "\`DATA_GO_KR_KEY\` 시크릿이 등록돼 있지 않아 이번 실행은 아무것도 받지 않았습니다."
            echo "그동안 페이지는 **가상의 샘플 데이터**로 뜹니다(그렇게 적혀 있습니다)."
            echo
            echo "등록하는 법:"
            echo "1. 공공데이터포털(data.go.kr)에서 *국토교통부_아파트 매매 실거래가 상세 자료* 활용신청"
            echo "2. 발급받은 **일반 인증키(Decoding)** 복사"
            echo "3. 저장소 Settings → Secrets and variables → Actions → New repository secret"
            echo "4. 이름 \`DATA_GO_KR_KEY\`, 값은 2번의 키"
            echo "5. Actions 탭에서 이 워크플로를 Run workflow 로 한 번 돌려 확인"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = "schedule" ]; then
            echo "::warning::DATA_GO_KR_KEY 시크릿이 없어 예약 실행을 건너뜁니다. 등록 방법은 실행 요약에 있습니다."
            exit 0
          fi
          echo "::error::DATA_GO_KR_KEY 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
          exit 1

      - name: 실거래가 받기
        if: steps.key.outputs.ok == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MONTHS: ${{ inputs.months }}
          LAWD: ${{ inputs.lawd }}
        run: |
          set -o pipefail
          args=(--out data/latest.json --max-fail 5)
          if [ -n "$LAWD" ]; then args+=(--lawd "$LAWD"); else args+=(--config regions.json); fi
          if [ -n "$MONTHS" ]; then args+=(--months "$MONTHS"); fi
          cd real-estate
          python fetch_molit.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/fetch.log"
          {
            echo "### 실거래가 수집"
            echo '```'
            tail -n 12 "$RUNNER_TEMP/fetch.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 바뀐 게 있으면 커밋
        if: steps.key.outputs.ok == 'true'
        run: |
          # git diff 는 추적되지 않는 새 파일을 못 본다. 첫 실행에서 data/latest.json 이
          # 막 생겼을 때도 커밋되도록 status 로 본다.
          if [ -z "$(git status --porcelain -- real-estate/data)" ]; then
            echo "변경 없음 — 커밋하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A real-estate/data
          git commit -m "실거래가 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            echo "푸시 실패, 재시도 $i"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::커밋은 만들었지만 푸시하지 못했습니다. 다음 실행에서 다시 시도합니다."
            echo "커밋은 됐지만 푸시 실패 — 다음 실행에서 재시도합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
