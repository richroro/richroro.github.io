<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const { clamp, esc, charSVG, bgSVG, speedSVG, Snd, Voice, castVoice, speechText, NARRATOR } = window.AnimeEngine;
const EPS = window.EPISODES;
const params = new URLSearchParams(location.search);
const REC = params.get('rec') === '1';
if (REC) document.body.classList.add('rec');
const FX = window.AnimeEngine.particles($('#fx'));
$('#speed').innerHTML = speedSVG();

/* ---------------------------------------------------------------
   1. BUILD — episode → list of timed shots
   --------------------------------------------------------------- */
// split long narration into readable caption chunks
function chunks(text) {
  const parts = text.split(/(?<=[.!?…。])\s+/).filter(Boolean), out = [];
  for (const p of parts) {
    if (out.length && [...out[out.length - 1]].length + [...p].length <= 26) out[out.length - 1] += ' ' + p; else out.push(p);
  }
  return out;
}
const readT = s => clamp(.9 + [...s].length * .085, 1.9, 5.2);
function beatShots(b, sc) {
  const text = b.who ? b.t : (b.n || '');
  const cs = text ? (b.who ? [text] : chunks(text)) : [''];
  return cs.map((c, i) => ({ kind: 'beat', b, sc, text: c, first: i === 0, dur: (c ? readT(c) : 1.4) + (i === 0 && b.big ? .7 : 0) }));
}
function score(b, i) { return (b.quote ? 8 : 0) + (b.big ? 4 : 0) + (b.fx === 'flash' ? 1.5 : 0) + (b.who ? 2 : 0) + (i === 0 && !b.who ? 1.5 : 0) + .5; }
// every scene keeps its best beat, then the rest of the budget goes to the best value-per-second beats
function pickBeats(scenes, budget) {
  const cand = [];
  scenes.forEach((sc, si) => sc.beats.forEach((b, i) => {
    const shots = beatShots(b, sc), dur = shots.reduce((a, x) => a + x.dur, 0);
    cand.push({ si, i, shots, dur, v: score(b, i) / Math.sqrt(dur) });
  }));
  const pick = new Set(); let used = 0;
  scenes.forEach((_, si) => { const best = cand.filter(c => c.si === si).sort((a, b) => b.v - a.v)[0]; if (best) { pick.add(best); used += best.dur; } });
  for (const c of [...cand].sort((a, b) => b.v - a.v)) if (!pick.has(c) && used + c.dur <= budget) { pick.add(c); used += c.dur; }
  return cand.filter(c => pick.has(c)).flatMap(c => c.shots);
}
function build(ep, k) {
  const shots = [], no = EPS.indexOf(ep) + 1;
  if (k === 'story') {
    shots.push({ kind: 'intro', dur: 2.6, ep, no });
    shots.push(...pickBeats(ep.scenes, 40));
    shots.push({ kind: 'recap', dur: 5.2, ep });
    shots.push({ kind: 'outro', dur: 2.8, ep, next: '레슨 쇼츠에서 공식 하나씩 자세히' });
  } else {
    const n = +k - 1, L = ep.lessons[n], sc = ep.scenes[L[2] || 0];
    shots.push({ kind: 'intro', dur: 2.8, ep, no, lesson: n });
    shots.push(...pickBeats([sc], 30));
    shots.push({ kind: 'lesson', dur: 5.4, ep, n });
    const nx = ep.lessons[n + 1];
    shots.push({ kind: 'outro', dur: 2.8, ep, next: nx ? `다음 공식 #${n + 2} ${nx[0]}` : '전체 이야기는 사이트에서' });
  }
  shots.forEach(s => { s.say = line(s); });
  // exported shorts: stretch each shot to fit its recorded voice line
  const vd = window.__voiceDur;
  if (vd) shots.forEach((s, i) => { if (vd[i]) s.dur = Math.max(s.dur, vd[i] + (s.kind === 'beat' ? .45 : .7)); });
  let t = 0; shots.forEach(s => { s.t = t; t += s.dur; });
  return { shots, dur: t };
}
// what each shot says out loud, and in whose voice
function line(s) {
  const ep = s.ep;
  switch (s.kind) {
    case 'intro': return s.lesson == null ? { text: ep.hook || ep.title } : { text: `부자 공식 ${s.lesson + 1}번. ${ep.lessons[s.lesson][0]}.` };
    case 'beat': return s.text ? { text: s.text, who: s.b.who } : s.first && s.b.big ? { text: s.b.big } : null;
    case 'recap': return { text: `${ep.person}의 부자 공식. ` + ep.lessons.map((l, k) => `${['하나', '둘', '셋', '넷', '다섯'][k]}, ${l[0]}.`).join(' ') };
    case 'lesson': return { text: `${ep.lessons[s.n][0]}. ${ep.lessons[s.n][1]}` };
    case 'outro': return { text: '더 많은 이야기는 성공 애니에서.' };
  }
  return null;
}
function voiceJobs(ep, k) {
  const keep = window.__voiceDur; window.__voiceDur = null;
  const plan = build(ep, k); window.__voiceDur = keep;
  return plan.shots.map((s, i) => s.say && { i, text: speechText(s.say.text), ...castVoice(s.say.who ? ep.cast[s.say.who] : NARRATOR) }).filter(Boolean);
}

/* ---------------------------------------------------------------
   2. STAGE — same look as the main player, vertical framing
   --------------------------------------------------------------- */
const st = { ep: null, onStage: {}, curBg: '', front: 'A' };
function setBg(sc) {
  const key = sc.bg + sc.time + (sc.sign || ''); if (key === st.curBg) return; st.curBg = key;
  const f = st.front === 'A' ? $('#bgA') : $('#bgB'), b = st.front === 'A' ? $('#bgB') : $('#bgA');
  b.innerHTML = bgSVG(sc.bg, sc.time || 'day', { sign: sc.sign }); b.style.opacity = 1; f.style.opacity = 0; st.front = st.front === 'A' ? 'B' : 'A';
}
const POS = n => n === 1 ? [50] : n === 2 ? [27, 73] : n === 3 ? [20, 50, 80] : [14, 38, 62, 86].slice(0, n);
function layout(ids) {
  const pos = POS(ids.length), keep = {};
  ids.forEach((id, i) => {
    let el = st.onStage[id];
    if (!el) { el = document.createElement('div'); el.className = 'chr enter'; el.dataset.face = 'normal'; el.innerHTML = charSVG(st.ep.cast[id], 'normal');
      el.style.left = pos[i] + '%'; $('#chars').appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter'))); }
    el.style.left = pos[i] + '%'; el.style.height = ids.length > 1 ? '40cqh' : '48cqh';
    el.querySelector('svg').style.transform = pos[i] > 50 ? 'scaleX(-1)' : '';
    keep[id] = el;
  });
  for (const id in st.onStage) if (!keep[id]) { const el = st.onStage[id]; el.classList.add('enter'); setTimeout(() => el.remove(), 450); }
  st.onStage = keep;
}
function face(id, f) {
  const el = st.onStage[id]; if (!el || el.dataset.face === f) return;
  const fl = el.querySelector('svg').style.transform; el.dataset.face = f; el.innerHTML = charSVG(st.ep.cast[id], f); el.querySelector('svg').style.transform = fl;
}
function fx(k) {
  if (!k) return;
  if (k === 'flash') { const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  if (k === 'shake') { const s = $('#short'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
  if (k === 'speed') $('#speed').classList.add('on');
  if (k === 'zoom') $('#cam').classList.add('zoom');
  if (k === 'sparkle') FX.spawn('sparkle', 40);
  if (k === 'money') FX.spawn('money', 60);
  if (k === 'paper') FX.spawn('paper', 40);
  if (k === 'petal') FX.spawn('petal', 30);
  if (k === 'rain') FX.spawn('rain', 80);
  if (k === 'fire') { FX.spawn('ember', 50); $('#fire').classList.add('on'); }
  Snd.fx(k);
}
function big(text) {
  const b = $('#big'); b.classList.remove('go'); b.firstElementChild.textContent = text;
  b.classList.toggle('long', [...text].length > 9); void b.offsetWidth; b.classList.add('go'); Snd.fx('big');
}
function caption(who, text, quote) {
  const w = $('#who'), l = $('#line');
  w.style.visibility = who ? 'visible' : 'hidden'; w.firstElementChild.textContent = who || '';
  l.className = 'line' + (who ? '' : ' narr'); l.innerHTML = esc(text) + (quote ? '<span class="q">★ 실제 발언</span>' : '');
  void l.offsetWidth; if (text) l.classList.add('pop');
  $('#cap').style.visibility = text ? 'visible' : 'hidden';
}
function cards(on) { ['intro', 'lessonCard', 'outro'].forEach(id => $('#' + id).classList.toggle('on', id === on)); }
function hookHTML(ep, lesson) {
  if (lesson != null) return `부자 공식 #${lesson + 1}<br><em>${esc(ep.lessons[lesson][0])}</em>`;
  const h = ep.hook || ep.title, cut = h.lastIndexOf(' ', Math.ceil(h.length / 2) + 2);
  return cut > 0 ? `${esc(h.slice(0, cut))}<br><em>${esc(h.slice(cut + 1))}</em>` : `<em>${esc(h)}</em>`;
}

/* ---------------------------------------------------------------
   3. PLAYER
   --------------------------------------------------------------- */
const P = { plan: null, i: -1, timers: [], t0: 0, raf: 0, playing: false, chain: false, run: 0, clock: 0 };
function reset() {
  P.timers.forEach(clearTimeout); P.timers = []; cancelAnimationFrame(P.raf); P.run++; Voice.cancel();
  for (const id in st.onStage) st.onStage[id].remove(); st.onStage = {}; st.curBg = ''; st.scene = null;
  FX.clear(); FX.ambient = null; $('#fire').classList.remove('on'); $('#speed').classList.remove('on'); $('#cam').classList.remove('zoom');
  $('#big').classList.remove('go'); cards(null); caption('', ''); $('#year').classList.remove('show');
}
// Korean web fonts arrive in unicode-range slices; render every glyph once so no slice loads mid-video
function warmFonts(ep) {
  let w = $('#warm'); if (!w) { w = document.createElement('div'); w.id = 'warm'; w.setAttribute('aria-hidden', 'true');
    w.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;opacity:0;pointer-events:none'; document.body.appendChild(w); }
  const txt = [...new Set(JSON.stringify(ep) + $('.short').innerText + '0123456789#★▶→·…‘’“” 부자 공식 전체 애니 맨손에서 시작한 사람들 다음 레슨 쇼츠에서 하나씩 자세히 이렇게 했다 에게 배우는 의 편 실제 발언 EPISODE richroro.github.io/success-anime')].join('');
  w.innerHTML = [['var(--title)', 400], ['var(--body)', 900], ['var(--body)', 700], ['var(--body)', 500]]
    .map(([f, wt]) => `<span style="font-family:${f};font-weight:${wt}">${esc(txt)}</span>`).join('');
  return document.fonts.ready;
}
function load(ep, k) {
  reset();
  window.__fonts = warmFonts(ep);
  st.ep = ep; P.k = k; P.plan = build(ep, k);
  document.documentElement.style.setProperty('--accent', ep.color);
  const no = EPS.indexOf(ep) + 1, lesson = k === 'story' ? null : +k - 1;
  $('#tag').textContent = lesson == null ? `EP.${no} ${ep.person} · ${ep.company.replace(/ 창업자$/, '')}` : `${ep.person}에게 배우는 부자 공식`;
  $('#hook').innerHTML = hookHTML(ep, lesson);
  setBg(P.plan.shots.find(s => s.sc)?.sc || ep.scenes[0]);
  renderIntro(P.plan.shots[0]); cards('intro');
  $('#bar').style.width = '0'; $('#clock').textContent = '0:00';
  renderList();
  history.replaceState(null, '', `?ep=${ep.id}&k=${k}` + (REC ? '&rec=1' : ''));
}
function renderIntro(s) {
  const ep = s.ep, hero = ep.cast[ep.scenes[ep.scenes.length - 1].cast?.[0]] || Object.values(ep.cast)[0];
  $('#intro').innerHTML = s.lesson == null
    ? `<div class="ep">EPISODE ${s.no}</div><h1>${esc(ep.hook || ep.title)}</h1><p>${esc(ep.person)} · ${esc(ep.company)}</p><div class="face">${charSVG(hero, 'smile')}</div>`
    : `<div class="ep">부자 공식 #${s.lesson + 1}</div><h1>${esc(ep.lessons[s.lesson][0])}</h1><p>${esc(ep.person)}은 이렇게 했다</p><div class="face">${charSVG(hero, 'determined')}</div>`;
}
function play() {
  if (!P.plan) return;
  Voice.unlock();
  reset(); load(st.ep, P.k);
  $('#play').classList.add('hide'); P.playing = true;
  Snd.startLog(); window.__t0 = Date.now() / 1000; window.__done = false;
  P.t0 = performance.now();
  Snd.startBgm(st.ep.mood);
  runShots(P.run);
  const loop = () => { const t = (performance.now() - P.t0) / 1000, total = Math.max(P.plan.dur, P.clock);
    $('#bar').style.width = clamp(t / total * 100, 0, 100) + '%';
    $('#clock').textContent = `0:${String(Math.min(59, Math.floor(t))).padStart(2, '0')}`;
    P.raf = requestAnimationFrame(loop); };
  loop();
}
// shots start on an absolute clock (so exported audio lines up); a live voice line that runs long pushes the clock back
async function runShots(run) {
  const wait = ms => new Promise(r => P.timers.push(setTimeout(r, Math.max(0, ms))));
  P.clock = 0;
  for (let i = 0; i < P.plan.shots.length; i++) {
    const s = P.plan.shots[i];
    await wait(P.t0 + P.clock * 1000 - performance.now()); if (run !== P.run) return;
    Snd.record('shot', [i]);
    shot(s, i);
    const spoken = s.say && Voice.on ? Voice.speak(s.say.text, s.say.who ? st.ep.cast[s.say.who] : NARRATOR) : null;
    P.clock += s.dur;
    if (spoken) { await spoken; if (run !== P.run) return; P.clock = Math.max(P.clock, (performance.now() - P.t0) / 1000 + .25); }
  }
  await wait(P.t0 + P.clock * 1000 - performance.now()); if (run !== P.run) return;
  done();
}
function done() {
  P.playing = false; cancelAnimationFrame(P.raf); Snd.stopBgm(); $('#bar').style.width = '100%';
  window.__done = true;
  if (P.chain && !REC) {
    const all = allShorts(), i = all.findIndex(x => x.ep === st.ep && x.k === P.k), nx = all[(i + 1) % all.length];
    P.timers.push(setTimeout(() => { load(nx.ep, nx.k); play(); }, 900));
  } else if (!REC) $('#play').classList.remove('hide');
}
function shot(s, i) {
  P.i = i;
  if (s.kind === 'intro') { cards('intro'); Snd.fx('whoosh'); return; }
  if (s.kind === 'beat') {
    cards(null);
    const b = s.b, sc = s.sc;
    if (st.scene !== sc) {
      st.scene = sc; setBg(sc); FX.clear(); FX.ambient = sc.fx || null; $('#fire').classList.toggle('on', sc.fx === 'fire');
      const y = $('#year'); y.classList.remove('show'); setTimeout(() => { y.textContent = sc.year || ''; if (sc.year) y.classList.add('show'); }, 180);
      layout(sc.cast || [...new Set(sc.beats.filter(x => x.who).map(x => x.who))]);
    }
    if (s.first) { $('#speed').classList.remove('on'); $('#cam').classList.remove('zoom'); if (!b.big) $('#big').classList.remove('go'); }
    for (const id in st.onStage) { const el = st.onStage[id]; el.classList.toggle('dim', !!b.who && b.who !== id); el.classList.toggle('speak', b.who === id); el.classList.remove('talk'); }
    if (b.who && st.onStage[b.who]) {
      face(b.who, b.face || 'normal'); const el = st.onStage[b.who]; el.classList.add('talk');
      const vd = window.__voiceDur && window.__voiceDur[i];
      P.timers.push(setTimeout(() => el.classList.remove('talk'), (vd || Math.min(s.dur * .75, .5 + [...s.text].length * .07)) * 1000));
    }
    if (s.first) { fx(b.fx); if (b.big) big(b.big); }
    caption(b.who ? st.ep.cast[b.who].name : '', s.text, b.quote && s.first);
    if (s.text) Snd.fx('pop');
    return;
  }
  if (s.kind === 'recap') {
    caption('', ''); $('#big').classList.remove('go');
    $('#lessonCard').innerHTML = `<div class="kicker">${esc(s.ep.person)}의 부자 공식</div>
      <ul class="recap">${s.ep.lessons.map((l, k) => `<li><b>${k + 1}</b>${esc(l[0])}</li>`).join('')}</ul>`;
    cards('lessonCard'); FX.ambient = 'sparkle';
    [0, 350, 700].forEach(d => P.timers.push(setTimeout(() => Snd.fx('pop'), d + 150)));
    return;
  }
  if (s.kind === 'lesson') {
    caption('', ''); $('#big').classList.remove('go');
    const L = s.ep.lessons[s.n];
    $('#lessonCard').innerHTML = `<div class="kicker">${esc(s.ep.person)}의 부자 공식</div><div class="no">#${s.n + 1}</div><h2>${esc(L[0])}</h2><p>${esc(L[1])}</p>`;
    cards('lessonCard'); FX.spawn('sparkle', 40); FX.ambient = 'sparkle'; Snd.fx('ding');
    return;
  }
  if (s.kind === 'outro') {
    $('#outro').innerHTML = `<div class="t1">${esc(s.ep.person)} 편 전체 애니</div><div class="t2">맨손에서 시작한<br>사람들</div>
      <div class="url">richroro.github.io/success-anime</div><div class="t3">▶ ${esc(s.next)}</div>`;
    cards('outro'); Snd.fx('sparkle');
  }
}

/* ---------------------------------------------------------------
   4. LIST & CONTROLS
   --------------------------------------------------------------- */
function allShorts() { return EPS.flatMap(ep => [{ ep, k: 'story' }, ...ep.lessons.map((_, i) => ({ ep, k: String(i + 1) }))]); }
function renderList() {
  $('#list').innerHTML = EPS.map((ep, i) => `<div class="grp" style="--c:${ep.color}"><h3><i></i>EP.${i + 1} ${esc(ep.person)} <small>${esc(ep.title)}</small></h3><div class="chips">
    <button class="chip ${st.ep === ep && P.k === 'story' ? 'cur' : ''}" data-ep="${ep.id}" data-k="story">요약 · ${Math.round(build(ep, 'story').dur)}초</button>
    ${ep.lessons.map((l, k) => `<button class="chip ${st.ep === ep && P.k === String(k + 1) ? 'cur' : ''}" data-ep="${ep.id}" data-k="${k + 1}">#${k + 1} ${esc(l[0])}</button>`).join('')}</div></div>`).join('');
}
$('#list').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; load(EPS.find(x => x.id === c.dataset.ep), c.dataset.k); play(); });
$('#short').addEventListener('click', () => { if (!P.playing && !REC) play(); });
$('#bReplay').onclick = () => play();
$('#bSound').onclick = () => { Snd.init(); Snd.on = !Snd.on; if (Snd.ac.state === 'suspended') Snd.ac.resume();
  $('#bSound').textContent = Snd.on ? '🔊 배경음 켜짐' : '🔇 배경음 꺼짐'; $('#bSound').classList.toggle('on', Snd.on); if (Snd.on && P.playing) Snd.startBgm(st.ep.mood); else if (!Snd.on) Snd.stopBgm(true); };
Voice.on = Voice.supported && !REC;
const voiceBtn = () => { $('#bVoice').textContent = !Voice.supported ? '🗣 목소리 미지원' : Voice.on ? '🗣 목소리 켜짐' : '🗣 목소리 꺼짐'; $('#bVoice').classList.toggle('on', Voice.on); };
$('#bVoice').onclick = () => { if (!Voice.supported) return; Voice.unlock(); Voice.on = !Voice.on; if (!Voice.on) Voice.cancel(); voiceBtn(); };
voiceBtn();
Voice.onStatus = m => { $('#vstat').textContent = m ? '🗣 ' + m : ''; }; Voice.setStatus();
$('#bTest').onclick = () => Voice.test();
$('#bAll').onclick = () => { P.chain = !P.chain; $('#bAll').classList.toggle('on', P.chain); $('#bAll').textContent = P.chain ? '⏸ 연속 재생 중' : '연속 재생'; if (P.chain && !P.playing) play(); };
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); if (!P.playing) play(); } });

FX.start();
const ep0 = EPS.find(e => e.id === params.get('ep')) || EPS[0];
const k0 = params.get('k') && (params.get('k') === 'story' || ep0.lessons[+params.get('k') - 1]) ? params.get('k') : 'story';
load(ep0, k0);
if (REC) $('#play').classList.add('hide');
window.Shorts = { play, load, build, allShorts, voiceJobs, get dur() { return P.plan.dur; } };
})();
</script>
</body>
</html>
