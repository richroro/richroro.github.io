<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0a18">
<title>성공 애니 쇼츠 · 1분 성공 공식</title>
<meta name="description" content="한국 창업가들의 성장기와 성공 공식을 1분 세로 애니 쇼츠로. 에피소드 요약 쇼츠와 교훈 하나씩 담은 레슨 쇼츠.">
<link rel="canonical" href="https://richroro.github.io/success-anime/shorts.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff4d6d'/><path d='M38 28v44l36-22z' fill='%23fff'/></svg>">
<meta property="og:type" content="website">
<meta property="og:title" content="성공 애니 쇼츠 · 1분 성공 공식">
<meta property="og:description" content="정주영부터 토스까지, 창업가 8명의 성공 공식을 1분 세로 애니로.">
<meta property="og:url" content="https://richroro.github.io/success-anime/shorts.html">
<meta property="og:image" content="https://richroro.github.io/success-anime/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0a18;--card:#1c1730;--line:#342c50;--ink:#f4f1ff;--sub:#a9a2c7;--accent:#ff4d6d;--yellow:#ffd43b;
    --title:"Black Han Sans","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  .page{max-width:1100px;margin:0 auto;padding:12px 16px 60px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
  @media(max-width:860px){.page{grid-template-columns:1fr;gap:18px}}
  .top{max-width:1100px;margin:0 auto;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:var(--title);font-size:21px;display:flex;gap:9px;align-items:center}
  .logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:15px}
  .top nav{display:flex;gap:16px;font-size:14px;font-weight:700;color:var(--sub)}

  /* ========= 9:16 SHORT ========= */
  .holder{position:sticky;top:12px;justify-self:center}
  @media(max-width:860px){.holder{position:static}}
  .short{position:relative;width:min(400px,calc((100vh - 40px) * 9 / 16),92vw);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;
    container-type:size;isolation:isolate;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);user-select:none;cursor:pointer}
  body.rec{background:#000}
  body.rec .top,body.rec .side{display:none}
  body.rec .page{display:block;padding:0;max-width:none}
  body.rec .holder{position:static}
  body.rec .short{width:100vw;height:100vh;border-radius:0;box-shadow:none;aspect-ratio:auto;cursor:none}

  .L{position:absolute;inset:0}
  .bg{transition:opacity .7s}
  .bg svg{width:100%;height:100%;display:block;animation:kb 14s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.16) translateX(-2%)}}
  .cam{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .cam.zoom{transform:scale(1.18) translateY(3%)}
  .shake{animation:shake .5s linear}
  @keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-2.4cqw,1cqw)}25%{transform:translate(2cqw,-1.4cqw)}40%{transform:translate(-1.6cqw,-.8cqw)}55%{transform:translate(1.2cqw,1.2cqw)}70%{transform:translate(-.8cqw,.6cqw)}85%{transform:translate(.4cqw,-.4cqw)}}
  .firebg{z-index:2;opacity:0;transition:opacity .6s;pointer-events:none;background:radial-gradient(120% 60% at 50% 100%,rgba(255,120,20,.8),rgba(255,60,0,.25) 45%,transparent 70%);mix-blend-mode:screen;animation:flk .18s infinite alternate}
  .firebg.on{opacity:1}
  @keyframes flk{to{filter:brightness(1.25)}}
  .chars{z-index:3}
  .chr{position:absolute;bottom:27cqh;height:46cqh;aspect-ratio:240/360;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.8,.2,1),filter .3s,opacity .45s,transform .3s}
  .chr svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1.4cqw 2cqw rgba(0,0,0,.45))}
  .chr.dim{filter:brightness(.72) saturate(.8)}
  .chr.enter{opacity:0;transform:translateX(-50%) translateY(8%)}
  .chr.speak{transform:translateX(-50%) translateY(-2%) scale(1.04);z-index:2}
  .chr .bob{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes breathe{50%{transform:scaleY(1.012) translateY(-1px)}}
  .chr .eyes{animation:blink 4.2s infinite;transform-origin:120px 118px}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
  .chr .m2{display:none}
  .chr.talk .m1{animation:mA .2s steps(1) infinite}
  .chr.talk .m2{display:inline;animation:mB .2s steps(1) infinite}
  @keyframes mA{0%{opacity:1}50%{opacity:0}}
  @keyframes mB{0%{opacity:0}50%{opacity:1}}
  .sweat{animation:sweat 1.2s ease-in infinite}
  @keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
  .tear{animation:tear 1s ease-in infinite}
  @keyframes tear{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(34px);opacity:0}}
  .speed{z-index:4;opacity:0;transition:opacity .2s;mix-blend-mode:screen;pointer-events:none}
  .speed.on{opacity:.85}
  .speed svg{width:100%;height:100%;animation:spin 1.4s linear infinite}
  @keyframes spin{to{transform:rotate(8deg) scale(1.06)}}
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
  .shade{z-index:5;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,18,.94) 0,rgba(8,6,18,.8) 15%,rgba(8,6,18,.35) 24%,transparent 32%,transparent 55%,rgba(8,6,18,.7) 72%,rgba(8,6,18,.95) 100%)}
  .flash{z-index:9;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:fl .55s ease-out}
  @keyframes fl{0%{opacity:.95}100%{opacity:0}}

  /* top banner (hook) */
  .banner{position:absolute;left:0;right:0;top:0;z-index:10;padding:5.5cqh 6cqw 0;text-align:center}
  .tag{display:inline-block;font-weight:900;font-size:3.4cqw;padding:.8cqw 3cqw;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.2px}
  .hook{font-family:var(--title);font-size:7.6cqw;line-height:1.18;margin-top:2cqw;color:#fff;text-shadow:0 .6cqw 0 rgba(0,0,0,.55),0 0 3cqw rgba(0,0,0,.6);word-break:keep-all}
  .hook em{font-style:normal;color:var(--yellow)}
  .year{display:inline-block;margin-top:2.6cqw;font-weight:700;font-size:3.5cqw;color:#fff;background:rgba(0,0,0,.45);padding:.8cqw 2.6cqw;border-radius:2cqw;border-left:1cqw solid var(--accent);
    opacity:0;transform:translateY(-1cqw);transition:.4s}
  .year.show{opacity:1;transform:none}

  /* captions */
  .cap{position:absolute;left:5cqw;right:5cqw;top:72cqh;z-index:10;text-align:center}
  .who{display:inline-block;font-family:var(--title);font-size:4.4cqw;background:var(--accent);color:#fff;padding:.6cqw 3.2cqw .4cqw;border-radius:1.8cqw;transform:skewX(-8deg);margin-bottom:2cqw}
  .who b{display:inline-block;transform:skewX(8deg);font-weight:400}
  .line{font-weight:900;font-size:6.1cqw;line-height:1.38;color:#fff;word-break:keep-all;
    text-shadow:0 .5cqw 0 rgba(0,0,0,.7),0 0 1.4cqw rgba(0,0,0,.85),.3cqw .3cqw 0 rgba(0,0,0,.7),-.3cqw -.3cqw 0 rgba(0,0,0,.7)}
  .line.narr{font-weight:700;font-size:5.4cqw;color:#f1edff}
  .line.pop{animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.86);opacity:0}}
  .line .q{display:block;font-size:3.2cqw;color:var(--yellow);margin-top:1cqw;font-weight:700}

  .big{position:absolute;left:0;right:0;top:40cqh;z-index:9;text-align:center;padding:0 6cqw;pointer-events:none}
  .big span{display:inline-block;font-family:var(--title);font-size:11cqw;line-height:1.12;color:#fff;-webkit-text-stroke:.5cqw rgba(0,0,0,.35);
    text-shadow:0 1cqw 0 var(--accent),0 2cqw 4cqw rgba(0,0,0,.6);opacity:0;word-break:keep-all}
  .big.long span{font-size:8.2cqw}
  .big.go span{animation:bigin 2.4s cubic-bezier(.2,1.3,.3,1) forwards}
  @keyframes bigin{0%{transform:scale(2.4) rotate(-5deg);opacity:0}14%{transform:scale(1) rotate(-3deg);opacity:1}82%{transform:scale(1.05) rotate(-3deg);opacity:1}100%{transform:scale(1.1) rotate(-3deg);opacity:0}}

  .foot{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 6cqw 4.2cqh;display:flex;align-items:center;gap:3cqw;font-size:3.1cqw;font-weight:700;color:rgba(255,255,255,.8)}
  .foot .bar{flex:1;height:.9cqw;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  .foot .bar i{display:block;height:100%;width:0;background:var(--accent)}

  /* full-screen cards */
  .card{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8cqw;
    opacity:0;pointer-events:none;transition:opacity .35s}
  .card.on{opacity:1}
  .intro{background:radial-gradient(circle at 50% 42%,var(--accent),#0d0a18 75%)}
  .intro .ep{font-family:var(--title);font-size:4.4cqw;letter-spacing:1.2cqw;opacity:.9}
  .intro h1{font-family:var(--title);font-weight:400;font-size:12.5cqw;line-height:1.1;margin:3cqw 0 4cqw;text-shadow:0 1.2cqw 0 rgba(0,0,0,.3);word-break:keep-all}
  .intro p{font-size:4.6cqw;font-weight:700;opacity:.95;word-break:keep-all;line-height:1.5}
  .intro .face{width:46cqw;aspect-ratio:240/360;margin-top:4cqw;margin-bottom:-30cqh}
  .card.on.intro h1{animation:ipop .7s cubic-bezier(.2,1.4,.3,1)}
  @keyframes ipop{from{transform:scale(.5) rotate(-8deg);opacity:0}}

  .lesson{background:rgba(10,8,22,.86);backdrop-filter:blur(8px)}
  .lesson .no{font-family:var(--title);font-size:24cqw;line-height:1;color:var(--accent);text-shadow:0 1.2cqw 0 rgba(0,0,0,.35)}
  .lesson .kicker{font-size:4.2cqw;font-weight:900;color:var(--yellow);letter-spacing:.3cqw;margin-bottom:2cqw}
  .lesson h2{font-family:var(--title);font-weight:400;font-size:10cqw;line-height:1.18;margin:2cqw 0 4cqw;word-break:keep-all}
  .lesson p{font-size:5cqw;font-weight:700;line-height:1.55;color:#e6e0ff;word-break:keep-all}
  .card.on.lesson h2{animation:ipop .6s cubic-bezier(.2,1.4,.3,1)}
  .recap{list-style:none;width:100%;display:flex;flex-direction:column;gap:3cqw;margin-top:4cqw}
  .recap li{background:rgba(255,255,255,.08);border:.3cqw solid rgba(255,255,255,.14);border-radius:3cqw;padding:3.4cqw 4cqw;text-align:left;font-size:5.4cqw;font-weight:900;
    opacity:0;transform:translateX(-8cqw)}
  .recap li b{color:var(--accent);font-family:var(--title);font-weight:400;margin-right:2.4cqw}
  .card.on .recap li{animation:slide .45s cubic-bezier(.2,1.2,.4,1) forwards}
  .card.on .recap li:nth-child(2){animation-delay:.35s}
  .card.on .recap li:nth-child(3){animation-delay:.7s}
  @keyframes slide{to{opacity:1;transform:none}}

  .outro{background:radial-gradient(circle at 50% 45%,#2a2150,#0d0a18 75%)}
  .outro .t1{font-size:4.8cqw;font-weight:700;color:var(--sub)}
  .outro .t2{font-family:var(--title);font-size:9.4cqw;line-height:1.2;margin:2.4cqw 0 5cqw;word-break:keep-all}
  .outro .url{font-weight:900;font-size:4.3cqw;white-space:nowrap;background:var(--accent);padding:2.4cqw 5cqw;border-radius:99px}
  .outro .t3{margin-top:5cqw;font-size:4.2cqw;color:var(--yellow);font-weight:700}

  .play{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.35)}
  .play.hide{display:none}
  .play span{width:20cqw;height:20cqw;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 2cqw 6cqw rgba(0,0,0,.5)}
  .play span::after{content:"";border-left:6cqw solid #fff;border-top:3.6cqw solid transparent;border-bottom:3.6cqw solid transparent;margin-left:1.4cqw}

  /* ========= formats ========= */
  /* cold open: cinematic bars; flashback: faded film */
  .bars i{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;transition:height .45s cubic-bezier(.2,.8,.2,1)}
  .bars i:first-child{top:0}.bars i:last-child{bottom:0}
  .short.letterbox .bars i{height:9cqh}
  .short.letterbox .banner{opacity:0}
  .banner{transition:opacity .35s}
  .cam{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .6s}
  .cam.past{filter:sepia(.8) saturate(.65) contrast(.92) brightness(.96)}
  .short.past .shade{background:linear-gradient(180deg,rgba(40,24,8,.92) 0,rgba(40,24,8,.72) 15%,rgba(40,24,8,.3) 24%,transparent 32%,transparent 55%,rgba(40,24,8,.66) 72%,rgba(20,12,4,.95) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(30,18,6,.6))}
  .short.past .year{border-left-color:#d9a441;background:rgba(40,24,8,.6)}
  .rewind{background:rgba(6,6,10,.62);backdrop-filter:blur(2px)}
  .rewind::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 .4cqh,transparent .4cqh 1.1cqh);animation:scan .25s linear infinite}
  @keyframes scan{to{background-position:0 1.1cqh}}
  .rewind .rw{font-family:var(--title);font-size:16cqw;line-height:1;letter-spacing:-1cqw;color:#fff;animation:rwb .5s steps(2) infinite}
  @keyframes rwb{50%{opacity:.35}}
  .rewind .ry{font-family:var(--title);font-size:22cqw;line-height:1.05;margin-top:3cqw;font-variant-numeric:tabular-nums;color:var(--yellow);text-shadow:.8cqw 0 0 rgba(255,0,80,.55),-.8cqw 0 0 rgba(0,200,255,.55)}
  .rewind .ry.lbl{font-size:12cqw;word-break:keep-all}
  .rewind .rl{font-size:4.6cqw;font-weight:900;letter-spacing:.8cqw;margin-top:2cqw;opacity:.85}

  /* quiz */
  .chr.sil svg{filter:brightness(0) drop-shadow(0 0 1.4cqw rgba(255,255,255,.7))}
  .hint{position:absolute;left:0;right:0;top:36cqh;z-index:11;text-align:center;pointer-events:none;opacity:0;transform:scale(1.8);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.3,1)}
  .hint.on{opacity:1;transform:none}
  .hint span{display:inline-block;font-family:var(--title);font-size:13cqw;background:var(--yellow);color:#111;padding:1cqw 6cqw;border-radius:3cqw;transform:rotate(-4deg);box-shadow:0 1.4cqw 0 rgba(0,0,0,.4)}
  .quiz{background:radial-gradient(circle at 50% 58%,#2b2450,#0b0916 72%)}
  .quiz .q1{font-family:var(--title);font-size:10.5cqw;line-height:1.15;word-break:keep-all}
  .quiz .q1 em{font-style:normal;color:var(--yellow)}
  .quiz .q2{font-size:4.6cqw;font-weight:700;opacity:.85;margin-top:2cqw}
  .quiz .fig{width:50cqw;aspect-ratio:240/360;margin-top:3cqw;position:relative}
  .quiz .fig svg{width:100%;height:100%}
  .quiz .fig.sil svg{filter:brightness(0) drop-shadow(0 0 2cqw rgba(255,255,255,.8))}
  .quiz .fig b{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--title);font-size:24cqw;color:var(--yellow);text-shadow:0 1cqw 0 rgba(0,0,0,.5)}
  .quiz .cnt{font-family:var(--title);font-size:48cqw;line-height:1;color:var(--yellow);animation:cnt .8s ease-out infinite}
  @keyframes cnt{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.2}}
  .quiz .name{font-family:var(--title);font-size:17cqw;line-height:1.05;margin-top:1cqw;animation:ipop .7s cubic-bezier(.2,1.4,.3,1)}
  .quiz.reveal{background:radial-gradient(circle at 50% 50%,var(--accent),#0b0916 75%)}

  /* numbers */
  .stat{position:absolute;left:0;right:0;top:25cqh;bottom:30cqh;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6cqw;
    opacity:0;transition:opacity .3s;pointer-events:none;background:radial-gradient(ellipse at center,rgba(8,6,18,.82) 30%,rgba(8,6,18,0) 72%)}
  .stat.on{opacity:1}
  .stat .pre{font-size:5.6cqw;font-weight:900;color:#fff;opacity:.9}
  .stat .num{font-family:var(--title);font-size:27cqw;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1.4cqw 0 var(--accent),0 3cqw 6cqw rgba(0,0,0,.6);white-space:nowrap}
  .stat.small .num{font-size:20cqw}
  .stat .num em{font-style:normal;font-size:.36em;margin-left:1cqw;color:var(--yellow);text-shadow:none}
  .stat .lbl{margin-top:3cqw;font-size:5.6cqw;font-weight:900;line-height:1.35;word-break:keep-all;background:var(--accent);color:#fff;padding:1cqw 3.4cqw;border-radius:2cqw}

  /* manga */
  .manga{position:absolute;inset:0;z-index:9;display:none;background:#f3efe4 radial-gradient(rgba(0,0,0,.16) .28cqw,transparent .34cqw) 0 0/1.7cqw 1.7cqw}
  .short.manga-on .manga{display:block}
  .short.manga-on .banner{background:#111;padding-bottom:2.6cqh}
  .short.manga-on .banner .year{display:none}
  .short.manga-on .foot{color:#111}
  .short.manga-on .foot .bar{background:rgba(0,0,0,.15)}
  .mpage{position:absolute;left:4cqw;right:4cqw;top:25.5cqh;bottom:9cqh;display:grid;gap:2.2cqw;animation:pagein .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes pagein{from{transform:translateX(30%) rotate(3deg);opacity:0}}
  .mpage.n1{grid-template-areas:"a";grid-template-rows:1fr}
  .mpage.n2{grid-template-areas:"a" "b";grid-template-rows:1fr 1fr}
  .mpage.n3.v0{grid-template-areas:"a a" "b c";grid-template-rows:1fr 1.15fr;grid-template-columns:1fr 1fr}
  .mpage.n3.v1{grid-template-areas:"a b" "c c";grid-template-rows:1.15fr 1fr;grid-template-columns:1fr 1fr}
  .mpage.n3.v2{grid-template-areas:"a" "b" "c";grid-template-rows:1fr 1fr 1fr}
  .panel{position:relative;overflow:hidden;border:.9cqw solid #111;background:#fff;opacity:0;transform:scale(.92)}
  .panel.in{opacity:1;transform:none;transition:opacity .25s,transform .35s cubic-bezier(.2,1.3,.4,1)}
  .panel:nth-child(1){grid-area:a}.panel:nth-child(2){grid-area:b}.panel:nth-child(3){grid-area:c}
  .panel .pbg{position:absolute;inset:0}
  .panel .pbg svg{width:100%;height:100%;display:block}
  .panel .chr{bottom:-42%;height:128%;left:50%}
  .panel.wide .chr{left:30%;height:150%;bottom:-62%}
  .panel .bub{position:absolute;right:4%;top:6%;max-width:64%;background:#fff;color:#111;border:.6cqw solid #111;border-radius:48% 52% 46% 54%/55% 50% 50% 45%;
    padding:2.4cqw 3.2cqw;font-family:"Gowun Dodum",var(--body);font-weight:700;font-size:4.2cqw;line-height:1.35;word-break:keep-all;text-align:center}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const { clamp, esc, charSVG, bgSVG, speedSVG, Snd } = window.AnimeEngine;
const EPS = window.EPISODES;
const params = new URLSearchParams(location.search);
const REC = params.get('rec') === '1';
if (REC) document.body.classList.add('rec');
const FX = window.AnimeEngine.particles($('#fx'));
$('#speed').innerHTML = speedSVG();

/* ---------------------------------------------------------------
   1. BUILD — episode → list of timed shots
   --------------------------------------------------------------- */
// split long narration into readable caption chunks
function chunks(text) {
  const parts = text.split(/(?<=[.!?…。])\s+/).filter(Boolean), out = [];
  for (const p of parts) {
    if (out.length && [...out[out.length - 1]].length + [...p].length <= 26) out[out.length - 1] += ' ' + p; else out.push(p);
  }
  return out;
}
const readT = s => clamp(.9 + [...s].length * .085, 1.9, 5.2);
function beatShots(b, sc) {
  const text = b.who ? b.t : (b.n || '');
  const cs = text ? (b.who ? [text] : chunks(text)) : [''];
  return cs.map((c, i) => ({ kind: 'beat', b, sc, text: c, first: i === 0, dur: (c ? readT(c) : 1.4) + (i === 0 && b.big ? .7 : 0) }));
}
function score(b, i) { return (b.quote ? 8 : 0) + (b.big ? 4 : 0) + (b.fx === 'flash' ? 1.5 : 0) + (b.who ? 2 : 0) + (i === 0 && !b.who ? 1.5 : 0) + .5; }
// every scene keeps its best beat, then the rest of the budget goes to the best value-per-second beats
function pickBeats(scenes, budget) {
  const cand = [];
  scenes.forEach((sc, si) => sc.beats.forEach((b, i) => {
    const shots = beatShots(b, sc), dur = shots.reduce((a, x) => a + x.dur, 0);
    cand.push({ si, i, shots, dur, v: score(b, i) / Math.sqrt(dur) });
  }));
  const pick = new Set(); let used = 0;
  scenes.forEach((_, si) => { const best = cand.filter(c => c.si === si).sort((a, b) => b.v - a.v)[0]; if (best) { pick.add(best); used += best.dur; } });
  for (const c of [...cand].sort((a, b) => b.v - a.v)) if (!pick.has(c) && used + c.dur <= budget) { pick.add(c); used += c.dur; }
  return cand.filter(c => pick.has(c)).flatMap(c => c.shots);
}
/* formats: every short is a different kind of video, not the same template with different words */
const FORMATS = { chronicle: '연대기', cold: '결말부터', quiz: '누구일까?', numbers: '숫자로 보기', manga: '만화 컷' };
const LESSON_FORMATS = { scene: '장면', vs: 'VS', myth: '착각 깨기' };
const storyFormat = ep => (FORMATS[ep.format] ? ep.format : 'chronicle');
const lessonFormat = (ep, n) => ['scene', 'vs', 'myth'][(n + Math.max(0, EPS.indexOf(ep))) % 3];
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? a : b; };
const firstYear = s => { const m = String(s || '').match(/(1[89]\d\d|20\d\d)/); return m ? +m[1] : null; };
const heroIds = ep => Object.keys(ep.cast).filter(id => ep.cast[id].name === ep.person);
const hero = ep => ep.cast[heroIds(ep).slice(-1)[0]] || Object.values(ep.cast)[0];
// quiz: hide the answer everywhere it could leak (names, companies, product names)
function masker(ep) {
  const words = [ep.person, ...ep.company.replace(/창업자/g, '').split(/[\s·()]+/), ...(ep.quizHide || [])].filter(w => w && [...w].length >= 2)
    .sort((a, b) => b.length - a.length);
  return t => words.reduce((acc, w) => acc.split(w).join('○'.repeat(Math.min(3, [...w].length))), String(t || ''));
}
const outroShot = (ep, next) => ({ kind: 'outro', dur: 2.8, ep, next });
const endingShot = ep => ({ kind: 'ending', dur: 4.2, ep });
// a chapter card before the first shot of each titled scene
function withChapters(shots) {
  const seen = new Set(), out = [];
  for (const s of shots) {
    if (s.kind === 'beat' && s.first && s.sc.chapter && !seen.has(s.sc)) { seen.add(s.sc); out.push({ kind: 'chapter', dur: 1.5, sc: s.sc, past: s.past }); }
    out.push(s);
  }
  return out;
}

function buildChronicle(ep, no) {
  return [{ kind: 'intro', dur: 2.6, ep, no }, ...withChapters(pickBeats(ep.scenes, 31)), endingShot(ep), outroShot(ep, '레슨 쇼츠에서 공식 하나씩 자세히')];
}
// cold open: the climax first, rewind, the story in faded film, back to the present
function buildCold(ep) {
  const S = ep.scenes; let top = null;
  if (ep.climax) top = { si: ep.climax[0], b: S[ep.climax[0]].beats[ep.climax[1]] };
  else S.forEach((sc, si) => sc.beats.forEach(b => { if (si < S.length / 2) return;
    const v = (b.quote ? 20 : 0) + (b.big ? 6 : 0) + (b.who ? 2 : 0) + si / S.length * 4; if (!top || v > top.v) top = { v, si, b }; }));
  const csc = S[top.si], y0 = firstYear(S[0].year), y1 = firstYear(csc.year);
  const lab = sc => sc.kicker || sc.chapter || '';
  return [
    ...beatShots(top.b, csc).slice(0, 2).map(s => ({ ...s, letterbox: true, past: false })),
    { kind: 'rewind', dur: 2.3, ep, from: y1, to: y0, fromLabel: lab(csc), toLabel: lab(S[0]), sc: S[0], past: true },
    ...withChapters(pickBeats(S.slice(0, top.si), 22).map(s => ({ ...s, past: true }))),
    { kind: 'back', dur: 1.7, ep, from: y0, to: y1, fromLabel: lab(S[0]), toLabel: lab(csc), sc: csc, past: false },
    ...pickBeats(S.slice(top.si), 9).filter(s => s.b !== top.b).map(s => ({ ...s, past: false })),
    endingShot(ep), outroShot(ep, '레슨 쇼츠에서 공식 하나씩 자세히')
  ];
}
// quiz: silhouette + three hints + countdown + reveal
function buildQuiz(ep) {
  const S = ep.scenes, m = masker(ep), shots = [{ kind: 'quizIntro', dur: 3.2, ep }];
  [...new Set([0, Math.floor((S.length - 1) / 2), S.length - 2])].forEach((si, h) => {
    shots.push({ kind: 'hint', dur: 1.5, ep, n: h + 1, sc: S[si] });
    shots.push(...pickBeats([S[si]], 9).map(s => ({ ...s, quiz: true, text: m(s.text), bigText: s.b.big && m(s.b.big), year: m(S[si].year) })));
  });
  return [...shots, { kind: 'count', dur: 2.6, ep }, { kind: 'reveal', dur: 3.4, ep }, endingShot(ep), outroShot(ep, '레슨 쇼츠에서 공식 하나씩 자세히')];
}
// numbers: rolling counters from the timeline between the key moments
function buildNumbers(ep, no) {
  const S = ep.scenes, sy = S.map(sc => firstYear(sc.year)), used = new Set(), out = [{ kind: 'intro', dur: 2.4, ep, no }];
  const tl = (ep.timeline || []).map(([y, t]) => ({ y: firstYear(y), t })).filter(x => x.y);
  let prev = null, last = null;
  for (const s of withChapters(pickBeats(S, 20))) {
    if (s.kind === 'chapter') { out.push(s); continue; }
    if (s.sc !== last) {
      last = s.sc; const si = S.indexOf(s.sc), lo = sy[si], hi = sy.slice(si + 1).find(Boolean) || 9999;
      const e = lo && tl.find(x => !used.has(x) && x.y >= lo && x.y < hi);
      if (e) { used.add(e); out.push({ kind: 'stat', dur: 2.5, ep, sc: s.sc, num: e.y, from: prev || e.y - 15, unit: '년', label: e.t, year: true }); prev = e.y; }
    }
    // a big line with a number in it becomes a counter too
    const n = s.first && s.b.big && parseNum(s.b.big);
    out.push(n ? { ...s, statBig: n } : s);
  }
  return [...out, endingShot(ep), outroShot(ep, '레슨 쇼츠에서 공식 하나씩 자세히')];
}
function parseNum(t) {
  const m = String(t).match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/); if (!m) return null;
  const num = +m[2].replace(/,/g, ''), year = num > 1800 && num < 2100 && !/,/.test(m[2]);
  return { pre: m[1].replace(/[·\s]+$/, ''), num, unit: m[3].split('·')[0].trim(), label: year ? m[3].replace(/^[\s·]+/, '') : '', year, comma: /,/.test(m[2]) };
}
// manga: panels fill a page one by one; speech in bubbles
function buildManga(ep) {
  const beats = pickBeats(ep.scenes, 38).filter(s => s.text || s.b.big), pages = []; let pg = [];
  for (const s of beats) { if (pg.length === 3 || (pg.length >= 2 && pg[pg.length - 1].sc !== s.sc)) { pages.push(pg); pg = []; } pg.push(s); }
  if (pg.length) pages.push(pg);
  pages.forEach((p, pi) => p.forEach((s, i) => Object.assign(s, { kind: 'panel', page: pi, idx: i, n: p.length, dur: s.dur + (i === 0 ? .3 : 0) })));
  return [{ kind: 'cover', dur: 2.8, ep }, ...beats, endingShot(ep), outroShot(ep, '레슨 쇼츠에서 공식 하나씩 자세히')];
}
function buildLesson(ep, n, no) {

function autoCommon() { return commonGuy || (commonGuy = { name: '보통 사람', hair: '#3a3a3a', style: 'short', outfit: 'shirt', color: '#adb5bd', eye: '#2a1d12', age: 'adult' }); }

/* ---------------------------------------------------------------
   4. LIST & CONTROLS
   --------------------------------------------------------------- */
function allShorts() { return EPS.flatMap(ep => [{ ep, k: 'story' }, ...ep.lessons.map((_, i) => ({ ep, k: String(i + 1) }))]); }
function renderList() {
  $('#list').innerHTML = EPS.map((ep, i) => `<div class="grp" style="--c:${ep.color}"><h3><i></i>EP.${i + 1} ${esc(ep.person)} <small>${esc(ep.title)}</small></h3><div class="chips">
    <button class="chip ${st.ep === ep && P.k === 'story' ? 'cur' : ''}" data-ep="${ep.id}" data-k="story">요약 · ${FORMATS[storyFormat(ep)]} · ${Math.round(build(ep, 'story').dur)}초</button>
    ${ep.lessons.map((l, k) => `<button class="chip ${st.ep === ep && P.k === String(k + 1) ? 'cur' : ''}" data-ep="${ep.id}" data-k="${k + 1}">#${k + 1} ${esc(l[0])} <small>${LESSON_FORMATS[lessonFormat(ep, k)]}</small></button>`).join('')}</div></div>`).join('');
}
$('#list').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; load(EPS.find(x => x.id === c.dataset.ep), c.dataset.k); play(); });
$('#short').addEventListener('click', () => { if (!P.playing && !REC) play(); });
$('#bReplay').onclick = () => play();
$('#bSound').onclick = () => { Snd.init(); Snd.on = !Snd.on; if (Snd.ac.state === 'suspended') Snd.ac.resume();
  $('#bSound').textContent = Snd.on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; $('#bSound').classList.toggle('on', Snd.on); if (Snd.on && P.playing) Snd.startBgm(st.ep.mood); else if (!Snd.on) Snd.stopBgm(true); };
$('#bAll').onclick = () => { P.chain = !P.chain; $('#bAll').classList.toggle('on', P.chain); $('#bAll').textContent = P.chain ? '⏸ 연속 재생 중' : '연속 재생'; if (P.chain && !P.playing) play(); };
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); if (!P.playing) play(); } });

FX.start();
const ep0 = EPS.find(e => e.id === params.get('ep')) || EPS[0];
const k0 = params.get('k') && (params.get('k') === 'story' || ep0.lessons[+params.get('k') - 1]) ? params.get('k') : 'story';
load(ep0, k0);
if (REC) $('#play').classList.add('hide');
window.Shorts = { play, load, build, allShorts, get dur() { return P.plan.dur; } };
})();
</script>
</body>
</html>
