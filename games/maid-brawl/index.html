<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
const H = 540, ARENA = 960, GROUND = 432, WALL_L = 34, WALL_R = ARENA - 34, G = 2000, TAU = Math.PI * 2;
const OL = '#150b10';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const pick = a => a[Math.random() * a.length | 0];
const easeOut = t => 1 - (1 - t) * (1 - t);
const fmt = n => Math.round(n).toLocaleString('ko-KR');

const store = {
  get(k, d) { try { const v = localStorage.getItem('maidbrawl.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('maidbrawl.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ════════════════ 소리 ════════════════ */
let AC = null, master = null, noiseBuf = null, muted = store.get('muted', false), lastHitSfx = 0;
function ensureAudio() {
  try {
    if (!AC) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      AC = new A();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, when = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, ftype, f0, f1, q = 1, when = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.playbackRate.value = rand(0.8, 1.2);
  f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, rand(0, 0.5)); s.stop(t + dur + 0.02);
}
const sfx = {
  hit(p) {
    if (!AC) return;
    const now = AC.currentTime; if (now - lastHitSfx < 0.03) return; lastHitSfx = now;
    noise(0.1, 0.35 + p * 0.35, 'lowpass', 2600 + p * 1500, 300);
    tone('sine', 190 + p * 40, 42, 0.13 + p * 0.1, 0.45 + p * 0.3);
    if (p > 0.6) tone('triangle', 95, 32, 0.32, 0.4);
  },
  whoosh(h) { noise(h ? 0.16 : 0.1, h ? 0.16 : 0.08, 'bandpass', 700, 2800, 1.3); },
  block() { tone('square', 1500, 1150, 0.06, 0.08); tone('triangle', 2400, 1900, 0.14, 0.09); noise(0.05, 0.12, 'highpass', 3500, 3000); },
  hurt() { tone('sawtooth', 330, 110, 0.2, 0.16); noise(0.12, 0.25, 'lowpass', 1300, 250); },
  jump() { tone('sine', 360, 760, 0.1, 0.1); },
  dash() { noise(0.2, 0.2, 'bandpass', 2000, 450, 0.8); },
  land() { noise(0.08, 0.15, 'lowpass', 600, 120); },
  boom() { tone('sine', 120, 26, 0.8, 0.9); noise(0.7, 0.55, 'lowpass', 2000, 70); tone('sawtooth', 60, 28, 0.55, 0.12); },
  charge() { tone('sawtooth', 150, 900, 0.55, 0.07); tone('sine', 300, 1800, 0.55, 0.1); noise(0.55, 0.08, 'bandpass', 400, 3000, 2); },
  ko() { [660, 990, 1320].forEach((f, i) => tone('triangle', f, f * 1.01, 0.14, 0.1, i * 0.05)); },
  shoot() { tone('sine', 540, 240, 0.22, 0.09); },
  pickup() { tone('triangle', 700, 1500, 0.16, 0.14); tone('sine', 1400, 2100, 0.12, 0.06, 0.06); },
  wave() { [392, 523, 659, 784].forEach((f, i) => tone('triangle', f, f, 0.18, 0.09, i * 0.08)); },
  clear() { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.22, 0.1, i * 0.07)); },
  roar() { tone('sawtooth', 110, 60, 0.7, 0.18); noise(0.6, 0.2, 'lowpass', 900, 150); }
};
function setMuted(m) {
  muted = m; store.set('muted', m);
  $('bMute').textContent = m ? '🔇' : '🔊';
  if (master) master.gain.value = m ? 0 : 0.5;
}

/* ════════════════ 화면 배치 ════════════════ */
let W = 960, scale = 1, cssW = 960, cssH = 540, camX = 0, hudPadR = 90;
let isTouch = matchMedia('(pointer: coarse)').matches;
function layout() {
  document.body.classList.toggle('touch', isTouch);
  const app = $('app'), cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const portrait = isTouch && ah > aw;
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('landscape', !portrait);
  const stage = $('stage');
  let sh;
  if (portrait) {
    sh = Math.min(ah * 0.56, aw * H / 620);
    stage.style.flex = '0 0 auto'; stage.style.height = sh + 'px';
  } else {
    sh = ah; stage.style.flex = ''; stage.style.height = '';
  }
  W = clamp(Math.round(aw / sh * H), portrait ? 620 : 680, 960);
  cssW = Math.min(aw, sh * W / H); cssH = cssW * H / W;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cv.width / W;
  hudPadR = 88 / (cssW / W);
  // 패드 크기
  const s = portrait ? Math.min(1.2, aw / 420) : Math.min(1, ah / 430, aw / 720);
  $('dpad').style.transform = `scale(${s})`;
  $('btns').style.transform = `scale(${s})`;
  buildBg();
}

/* ════════════════ 배경 ════════════════ */
let bg = null, bgS = 0;
const WINDOWS = [160, 480, 800], SCONCES = [320, 640], FT = 330;
function buildBg() {
  const s = clamp(scale, 1, 2);
  if (bg && Math.abs(bgS - s) < 0.02) return;
  bgS = s;
  bg = document.createElement('canvas');
  bg.width = Math.ceil(ARENA * s); bg.height = Math.ceil(H * s);
  const g = bg.getContext('2d'); g.scale(s, s);
  paintBg(g);
}
function seeded(seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
function paintBg(g) {
  // 벽지
  let gr = g.createLinearGradient(0, 0, 0, FT);
  gr.addColorStop(0, '#34161b'); gr.addColorStop(0.55, '#4a2127'); gr.addColorStop(1, '#2b1216');
  g.fillStyle = gr; g.fillRect(0, 0, ARENA, FT);
  g.fillStyle = 'rgba(255,190,140,.05)';
  for (let y = 48, r = 0; y < 258; y += 24, r++) {
    for (let x = (r % 2) * 18; x < ARENA + 20; x += 36) {
      g.beginPath(); g.moveTo(x, y - 7); g.lineTo(x + 5, y); g.lineTo(x, y + 7); g.lineTo(x - 5, y); g.closePath(); g.fill();
    }
  }
  // 촛불 번짐
  for (const x of SCONCES) {
    gr = g.createRadialGradient(x, 185, 4, x, 185, 170);
    gr.addColorStop(0, 'rgba(255,175,90,.32)'); gr.addColorStop(1, 'rgba(255,175,90,0)');
