<script type="module">
import * as THREE from './three.min.js';
const V3 = THREE.Vector3;

/* ══════════════════════════════════════════════════════════════
   1. 작은 도구들 (난수 · 노이즈 · 저장)
   ══════════════════════════════════════════════════════════════ */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(7);
const R = (a = 0, b = 1) => a + (b - a) * rng();
const Rm = (a = 0, b = 1) => a + (b - a) * Math.random();   // 연출용 (결정적일 필요 없음)

function hash2(ix, iy, seed) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// 주기(px, py)를 주면 이음매 없이 반복되는 값 노이즈가 된다 (타일 텍스처용)
function vnoise(x, y, seed = 0, px = 0, py = 0) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  let x0 = ix, x1 = ix + 1, y0 = iy, y1 = iy + 1;
  if (px) { x0 = ((x0 % px) + px) % px; x1 = ((x1 % px) + px) % px; }
  if (py) { y0 = ((y0 % py) + py) % py; y1 = ((y1 % py) + py) % py; }

    g.save(); g.translate(x, y); g.rotate(rot);
    g.font = `900 ${size}px "Arial Black", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = size * 0.2; g.strokeStyle = stroke; g.strokeText(txt, 0, 0);
    g.fillStyle = fill; g.fillText(txt, 0, 0); g.restore();
  };
  tag('WASH ME', 160, 44, 58, '#ff4fb3', '#2b1a6b', -0.06);
  tag('뽀득', 470, 46, 62, '#38e1ff', '#1b2230', 0.05);
  tag('RICH', 760, 42, 60, '#ffe14d', '#d4380d', -0.04);
  tag('★', 950, 40, 70, '#7cff6b', '#1b5e20', 0.2);
  tag('ZZ', 1110, 46, 56, '#b388ff', '#311b92', 0.08);

  g.fillStyle = '#ff4fb3';
  for (const x of [90, 130, 210, 250]) g.fillRect(x, 60, 5, 12 + (x % 17));
  g.fillStyle = '#38e1ff';
  for (const x of [440, 500]) g.fillRect(x, 64, 5, 14);

function totals() {
  let ini = 0, rem = 0;
  for (const p of L.panels) { ini += p.initial; rem += Math.max(0, p.rem); }
  return { ini, rem, pct: ini > 0 ? 1 - rem / ini : 1 };
}
function stats() {
  const lvl = save.upg;
  return {
    power: 1 + 0.3 * lvl.power,
    spread: THREE.MathUtils.degToRad(16) * (1 + 0.22 * lvl.width),
    speed: 3.8 * (1 + 0.12 * lvl.speed),

}

function loadLevel(i) {
  const def = LEVELS[i];
  if (L) for (const p of L.panels) p.dispose();
  disposeWorld();
  critters.length = 0;
  rng = mulberry32(def.seed);
  L = { def, panels: [], obstacles: [], leafSpec: null, water: null, fade: [] };
  if (i === 2 && !GRAF) makeGraffiti();
  def.build();
  const masks = L.obstacles.filter(o => o.mask);
  for (const p of L.panels) p.generate(def.dirt, masks);
  L.groundPanels = L.panels.filter(p => p.key === 'g');
  L.wallPanels = L.panels.filter(p => p.key !== 'g');
  L.center = L.groundPanels.reduce((a, p) => a.add(p.center), new V3()).multiplyScalar(1 / L.groundPanels.length);
  L.center.y = 0;
  // 세척기와 일꾼
  machine = buildMachine(); machine.position.set(def.machine[0], 0, def.machine[1]); machine.rotation.y = 0.4; add(machine);
  L.obstacles.push({ x0: def.machine[0] - 0.5, z0: def.machine[1] - 0.45, x1: def.machine[0] + 0.5, z1: def.machine[1] + 0.45, y0: 0, y1: 1, move: true, spray: false });
  worker = buildWorker(); add(worker);
  G.pos.set(def.spawn[0], 0, def.spawn[1]); G.vel.set(0, 0, 0); G.face = Math.PI; G.walk = 0;
  worker.position.copy(G.pos); worker.rotation.y = G.face;
  hose = makeHose(); stream = makeStream(); reticle = makeReticle();
  leaves = makeLeaves(L.leafSpec);
  if (def.cat) critters.push(makeCat(def.cat));

    }
    aimX = av.x; aimZ = av.z;
    reticle.visible = true;
  } else if (input.mouse.on && !IS_TOUCH) {
    if (pickPointer(input.mouse.x, input.mouse.y, aimPt)) {
      spraying = input.mouse.down || k.has(' ');
      aimX = aimPt.x - G.pos.x; aimZ = aimPt.z - G.pos.z;
      reticle.visible = true;
    }
  } else if (k.has(' ')) {
    spraying = true;
    aimX = Math.sin(G.face); aimZ = Math.cos(G.face);
    aimPt.set(G.pos.x + aimX * 2.2, GY, G.pos.z + aimZ * 2.2);
    reticle.visible = false;
  } else reticle.visible = false;
  const st = stats(), spd = st.speed * (spraying ? 0.72 : 1);
  G.vel.x = lerp(G.vel.x, mx * spd, 1 - Math.exp(-dt * 14));
  G.vel.z = lerp(G.vel.z, mz * spd, 1 - Math.exp(-dt * 14));
  const ox = G.pos.x, oz = G.pos.z;
  G.pos.x += G.vel.x * dt; G.pos.z += G.vel.z * dt;
  collide(G.pos, 0.36);
  const moved = Math.hypot(G.pos.x - ox, G.pos.z - oz);
  G.movedDist += moved;
  // 방향
  const al = Math.hypot(aimX, aimZ);
  if (spraying && al > 0.01 || (reticle.visible && al > 0.3 && !IS_TOUCH)) G.face = lerpAngle(G.face, Math.atan2(aimX, aimZ), dt * 14);
  else if (Math.hypot(G.vel.x, G.vel.z) > 0.3) G.face = lerpAngle(G.face, Math.atan2(G.vel.x, G.vel.z), dt * 10);
  // 걷기 연출
  const u = worker.userData, sp = Math.hypot(G.vel.x, G.vel.z);
  G.walk += sp * dt * 3.2;
  const sw = Math.min(1, sp / 2) * 0.7;
  u.legs[0].rotation.x = Math.sin(G.walk) * sw; u.legs[1].rotation.x = -Math.sin(G.walk) * sw;
  const floor = onGroundPanel(G.pos.x, G.pos.z) ? GY : 0;
  worker.position.set(G.pos.x, floor + Math.abs(Math.sin(G.walk)) * 0.05 * Math.min(1, sp), G.pos.z);
  worker.rotation.y = G.face;
  u.torso.rotation.x = spraying ? -0.05 + Math.sin(G.time * 60) * 0.01 : 0;
  // 세척건을 목표 높이로 기울인다
  const pitch = spraying || reticle.visible ? Math.atan2(0.62, Math.max(0.8, Math.hypot(aimPt.x - G.pos.x, aimPt.z - G.pos.z))) : 0.35;
  u.wand.rotation.x = lerp(u.wand.rotation.x, pitch, 1 - Math.exp(-dt * 12));
  if (reticle.visible) { reticle.position.set(aimPt.x, aimPt.y + 0.01, aimPt.z); if (aimPt.y > GY + 0.05) reticle.rotation.x = Math.PI / 2; else reticle.rotation.x = 0; }
  G.spraying = spraying;
  return spraying;
}

/* ══════════════════════════════════════════════════════════════
   16. 화면 (메뉴 · HUD · 결과)
   ══════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const UPGRADES = [
  { k: 'power', icon: '💪', name: '펌프 압력', desc: '때가 더 빨리 벗겨져요 (+30%)', cost: [90, 180, 320] },
  { k: 'width', icon: '🌊', name: '넓은 노즐', desc: 'FAN 물줄기 폭 +22%', cost: [70, 150, 260] },
  { k: 'speed', icon: '👟', name: '미끄럼 방지 장화', desc: '이동 속도 +12%', cost: [50, 110, 200] },
];
const fmtTime = (s) => { const a = Math.abs(s), m = Math.floor(a / 60), ss = Math.floor(a % 60); return (s < 0 ? '+' : '') + m + ':' + String(ss).padStart(2, '0'); };
const money = (v) => '$' + Math.round(v).toLocaleString();

function renderMenu() {
  $('#wallet').textContent = money(save.money);
  const jobs = $('#jobs'); jobs.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const locked = i > 0 && !save.stars[i - 1];
    const b = document.createElement('button');
    b.className = 'job' + (locked ? ' lock' : '');
    const st = save.stars[i];
    b.innerHTML = `<div class="th" style="background:${lv.bg}">${lv.icon}</div>
      <div class="tx"><b>${i + 1}. ${lv.name}</b><span>${locked ? '앞 작업을 끝내면 열려요' : lv.desc}</span></div>
      <div class="rt">${locked ? '🔒' : `<div class="st">${'★'.repeat(st)}<s>${'★'.repeat(3 - st)}</s></div><div class="pay">보수 ${money(lv.pay)}</div><div>${fmtTime(lv.limit)}</div>`}</div>`;
    b.onclick = () => { tapped = true; Sfx.init(); if (locked) { Sfx.tone(220, 0.12, 'square', 0.05); return; } Sfx.click(); startLevel(i); };
    jobs.appendChild(b);
  });
  const shop = $('#shop'); shop.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl = save.upg[u.k], max = lvl >= u.cost.length, price = max ? 0 : u.cost[lvl];

    const bt = document.createElement('button'); bt.className = 'buy';
    bt.textContent = max ? '최고' : money(price);
    bt.disabled = max || save.money < price;
    bt.onclick = () => {
      if (save.money < price || max) return;
      save.money -= price; save.upg[u.k]++; persist(); Sfx.coin(); buzz(15); renderMenu();
    };
    row.appendChild(bt); shop.appendChild(row);
  }
  $('#help').textContent = IS_TOUCH ? '왼손으로 끌어서 이동, 오른손으로 끌어서 조준하면 물이 나가요. 멀리 끌수록 멀리 쏩니다.'
                                    : 'WASD 이동 · 마우스로 조준하고 왼쪽 버튼을 누르고 있으면 분사 · Q 노즐 전환';
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#jobs').classList.toggle('hide', b.dataset.tab !== 'jobs');

const soundIcon = () => save.sound

  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
$('#bSound').innerHTML = soundIcon();
$('#bSound').onclick = () => { save.sound = !save.sound; persist(); Sfx.init(); Sfx.setOn(save.sound); $('#bSound').innerHTML = soundIcon(); };
$('#bPause').onclick = () => pauseGame();
$('#bHi').onclick = () => highlight();
document.querySelectorAll('.noz button').forEach(b => b.onclick = () => setNozzle(b.dataset.m));

$('#rNext').onclick = () => { $('#result').classList.add('hide'); if (G.li + 1 < LEVELS.length) startLevel(G.li + 1); else { toMenu(); document.querySelector('.tabs button[data-tab=shop]').click(); } };

function setNozzle(m) {
  G.nozzle = m;
  document.querySelectorAll('.noz button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  Sfx.init(); Sfx.click(); buzz(8);
  if (G.tutStep === 3 && m === 'jet') coach(-1);
}
function toggleNozzle() { setNozzle(G.nozzle === 'fan' ? 'jet' : 'fan'); }
function highlight() {
  G.hiT = 3.2; $('#bHi').classList.add('on'); Sfx.init(); Sfx.tone(880, 0.12, 'triangle', 0.08); Sfx.tone(1320, 0.18, 'triangle', 0.06, 0.08);
}

let lastPct = -1, lastDone = -1, lastTimeTxt = '', lastCost = -1;
function refreshHUD(force) {
  const t = totals(), pct = G.doneCount === L.panels.length ? 100 : Math.min(99, Math.floor(t.pct * 100));
  if (pct !== lastPct || force) { $('#pfill').style.width = pct + '%'; $('#ppct').textContent = pct + '% 깨끗함'; lastPct = pct; }
  if (G.doneCount !== lastDone || force) {
    $('#pcount').textContent = `패널 ${G.doneCount}/${L.panels.length} 완료`;
    $('#pdots').innerHTML = L.panels.map(p => `<s class="${p.done ? 'on' : ''}"></s>`).join('');
    lastDone = G.doneCount;
  }
  const left = L.def.limit - G.time, tt = fmtTime(left);
  if (tt !== lastTimeTxt) { const el = $('#ctime'); el.textContent = tt; el.classList.toggle('over', left < 0); lastTimeTxt = tt; }
  const c = Math.round(G.cost);
  if (c !== lastCost) { $('#ccost').textContent = '−$' + c; lastCost = c; }
}

const COACH = IS_TOUCH ? [
  ['왼쪽 화면을 끌어서 걸어 보세요', '손가락을 떼면 멈춰요'],
  ['오른쪽 화면을 끌면 물이 나가요', '끄는 방향으로 조준, 멀리 끌수록 멀리 쏩니다'],
  ['좋아요! 바닥이 하얘질 때까지 쓸어 주세요', '까만 기름때는 JET 노즐이 훨씬 빨라요'],
  ['까만 기름때엔 오른쪽 아래 JET!', 'FAN은 넓게, JET은 좁고 세게'],
  ['패널 하나 끝! 모든 패널을 닦으면 작업 완료', '안 보이는 때는 “남은 때” 버튼으로 찾기'],
] : [
  ['W A S D 로 걸어 보세요', ''],
  ['마우스로 조준하고 왼쪽 버튼을 누르고 있으면 분사', '멀리 가리키면 멀리 쏩니다'],
  ['좋아요! 바닥이 하얘질 때까지 쓸어 주세요', '까만 기름때는 JET 노즐이 훨씬 빨라요 (Q)'],
  ['까만 기름때엔 JET! (Q 또는 우클릭)', 'FAN은 넓게, JET은 좁고 세게'],
  ['패널 하나 끝! 모든 패널을 닦으면 작업 완료', '안 보이는 때는 E 로 찾기'],
];
let coachT = 0;
function coach(step) {
  G.tutStep = step;
  const el = $('#coach');
  if (step < 0 || step >= COACH.length) { el.classList.add('hide'); return; }
  el.innerHTML = COACH[step][0] + (COACH[step][1] ? `<small>${COACH[step][1]}</small>` : '');
  el.classList.remove('hide'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  coachT = 0;
}
function coachUpdate(dt) {
  if (G.tutStep < 0) return;
  coachT += dt;
  if (G.tutStep === 0 && G.movedDist > 1.8) coach(1);
  else if (G.tutStep === 1 && G.cleaned > 40) coach(2);
  else if (G.tutStep === 2 && coachT > 6) coach(3);
  else if (G.tutStep === 3 && coachT > 9) coach(-1);
  else if (G.tutStep === 4 && coachT > 5) { coach(-1); save.tut = true; persist(); }
}

function startLevel(i) {
  G.li = i;
  loadLevel(i);
  G.mode = 'play'; G.time = 0; G.cost = 0; G.doneCount = L.panels.filter(p => p.done).length; G.finishing = 0; G.hiT = 0;
  G.movedDist = 0; G.cleaned = 0; G.lastHit = null;
  setNozzle('fan');
  clearFloatTexts();
  input.tm = input.ta = null; placeStick(stL, null); placeStick(stR, null); input.mouse.down = false;
  $('#menu').classList.add('hide'); $('#hud').classList.remove('hide'); $('#ctrl').classList.remove('hide');
  camDist = 12.5; camFollow.copy(G.pos);
  lastPct = lastDone = lastCost = -1; lastTimeTxt = '';
  refreshHUD(true);
  coach(i === 0 && !save.tut ? 0 : -1);
  if (i !== 0 || save.tut) { floatText(LEVELS[i].name, G.pos.x, 1.8, G.pos.z, 'gold', 1.8); }
}
function toMenu() {
  G.mode = 'menu';
  $('#hud').classList.add('hide'); $('#ctrl').classList.add('hide'); $('#coach').classList.add('hide');
  $('#menu').classList.remove('hide');
  G.tutStep = -1;
  clearFloatTexts();
  const last = Math.min(LEVELS.length - 1, save.stars.findIndex(s => !s) < 0 ? LEVELS.length - 1 : save.stars.findIndex(s => !s));
  G.li = last; loadLevel(last);
  Sfx.spray(false, false, 0, false);
  renderMenu();
}
function pauseGame() {
  if (G.mode !== 'play') return;
  G.mode = 'pause';
  $('#pause').classList.remove('hide');
  Sfx.spray(false, false, 0, false);
  input.tm = input.ta = null; placeStick(stL, null); placeStick(stR, null); input.mouse.down = false;
}
function resumeGame() {
  if (G.mode !== 'pause') return;
  G.mode = 'play'; $('#pause').classList.add('hide'); Sfx.init();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); Sfx.suspend(); }
});

function finishLevel() {
  G.mode = 'result';
  const def = L.def, left = def.limit - G.time;
  const stars = left >= def.limit * 0.25 ? 3 : left >= 0 ? 2 : 1;
  const bonus = Math.max(0, Math.round(left * 0.8));
  const penalty = left < 0 ? Math.min(def.pay * 0.6, Math.round(-left * 0.6)) : 0;
  const cost = Math.round(G.cost);
  const total = Math.max(0, def.pay - penalty + bonus - cost);
  const first = !save.stars[G.li];
  save.money += total;
  save.stars[G.li] = Math.max(save.stars[G.li], stars);
  save.best[G.li] = save.best[G.li] ? Math.min(save.best[G.li], G.time) : G.time;
  save.tut = true;
  persist();
  $('#rTitle').textContent = stars === 3 ? '완벽해요! 반짝반짝' : stars === 2 ? '작업 완료!' : '늦었지만 완료!';
  $('#rStars').innerHTML = [0, 1, 2].map(i => `<s class="${i < stars ? 'on' : ''}">★</s>`).join('');
  $('#rSub').textContent = `걸린 시간 ${fmtTime(G.time)} · 최고 ${fmtTime(save.best[G.li])}` + (stars < 3 ? ` · 별 3개는 ${fmtTime(def.limit * 0.75)} 안에` : '');
  $('#rRows').innerHTML = `<div><span>작업 보수</span><b>${money(def.pay)}</b></div>` +
    (penalty ? `<div class="m"><span>지각 감액</span><b>−${money(penalty)}</b></div>` : '') +
    (bonus ? `<div><span>빨리 끝낸 보너스</span><b>+${money(bonus)}</b></div>` : '') +
    `<div class="m"><span>물 · 연료비</span><b>−${money(cost)}</b></div>` +
    `<div class="t"><span>받은 돈</span><b>+${money(total)}</b></div>`;
  $('#rNext').textContent = G.li + 1 < LEVELS.length ? '다음 작업 ▶' : '장비 사러 가기';
  if (first && G.li + 1 < LEVELS.length) $('#rSub').textContent += ` · 새 작업 “${LEVELS[G.li + 1].name}” 열림`;
  G.hiT = 0; HI.value = 0; $('#bHi').classList.remove('on');
  $('#result').classList.remove('hide');
  $('#hud').classList.add('hide'); $('#ctrl').classList.add('hide'); $('#coach').classList.add('hide');
  Sfx.spray(false, false, 0, false);
}

/* ══════════════════════════════════════════════════════════════
   17. 메인 루프
   ══════════════════════════════════════════════════════════════ */
let last = performance.now(), frames = 0, slowAcc = 0, prCheck = 0;
function step(dt) {
  const play = G.mode === 'play';
  if (play) {
    if (!G.finishing) G.time += dt;
    const spraying = playerUpdate(dt);
    sprayUpdate(dt, spraying, aimPt);
    coachUpdate(dt);
    if (G.doneCount === L.panels.length && !G.finishing) {
      G.finishing = 1.4; Sfx.fanfare(); buzz([30, 60, 30]);
      floatText('작업 완료!', G.pos.x, 2.2, G.pos.z, 'gold', 1.6);
      for (let i = 0; i < 70; i++) spawn(G.pos.x + Rm(-3, 3), Rm(0.5, 3), G.pos.z + Rm(-3, 3), Rm(-1, 1), Rm(1, 3), Rm(-1, 1), Rm(1, 1.8), Rm(0.12, 0.24), [1, 0.4, 0.4, 1][i % 4], [0.9, 0.8, 1, 0.9][i % 4], [0.3, 0.9, 0.5, 1][i % 4], 1, -2, 1, 2);
    }
    if (G.finishing) { G.finishing -= dt; if (G.finishing <= 0) { G.finishing = 0; sprayUpdate(dt, false); finishLevel(); } }
  } else if (worker && G.mode !== 'pause') {
    sprayUpdate(dt, false);
  }
  if (G.mode !== 'pause') {
    for (const c of critters) c.update(dt);
    updateLeaves(dt);
    if (hose) updateHose(dt);
    if (L) for (const p of L.panels) p.update(dt);
    updateParticles(dt);
    for (const f of L.fade) { const near = (G.pos.x - f.x) ** 2 + (G.pos.z - f.z) ** 2 < f.r * f.r && G.mode !== 'menu'; f.m.opacity = lerp(f.m.opacity, near ? 0.22 : 1, 1 - Math.exp(-dt * 8)); f.m.depthWrite = f.m.opacity > 0.95; }
    if (L.water) { const t = performance.now() / 1000; TEX.water.offset.set(Math.sin(t * 0.3) * 0.05, t * 0.03); }
    if (machine) machine.children[0].position.y = 0.5 + (G.spraying ? Math.sin(performance.now() / 18) * 0.008 : 0);
  }
  if (G.hiT > 0) { G.hiT -= dt; HI.value = G.hiT > 0 ? clamp(G.hiT * 2, 0, 1) * (0.75 + 0.25 * Math.sin(G.hiT * 12)) : 0; if (G.hiT <= 0) $('#bHi').classList.remove('on'); }
  if (play && Math.floor(G.time * 4) !== Math.floor((G.time - dt) * 4)) refreshHUD(false);
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt <= 0) dt = 0.001;
  step(dt);
  stream.mat.uniforms.uTime.value = now / 1000;
  if (G.mode === 'menu') {
    G.menuT += dt;
    placeCamera(dt, L.center, 17, Math.sin(G.menuT * 0.12) * 0.6);
  } else if (G.mode !== 'pause') {
    const la = G.spraying ? 0.9 : 0.4;
    placeCamera(dt, _v4.set(G.pos.x + Math.sin(G.face) * la, 0, G.pos.z + Math.cos(G.face) * la * 0.6), camDist);
  }
  updateFloatTexts(dt);
  renderer.render(scene, camera);
  // 느린 기기면 해상도를 조금 낮춘다
  frames++; slowAcc += dt; prCheck += dt;
  if (prCheck > 2.5) {
    const avg = slowAcc / frames;
    if (avg > 1 / 42 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
    frames = 0; slowAcc = 0; prCheck = 0;
  }
}

makeTextures();
resize();
toMenu();
document.getElementById('load').remove();
requestAnimationFrame((t) => { last = t; frame(t); });

// 자동 검증용 (헤드리스 브라우저에서 부른다)
// canHit: (sx, sz) 에 서서 (tx, ty, tz) 를 쏘면 실제로 그 자리에 물이 닿는지
function canHit(sx, sz, tx, ty, tz) {
  const px = G.pos.x, pz = G.pos.z, pf = G.face, pw = worker.userData.wand.rotation.x;
  const face = Math.atan2(tx - sx, tz - sz), hd = Math.hypot(tx - sx, tz - sz);
  worker.position.set(sx, 0, sz); worker.rotation.y = face;
  worker.userData.wand.rotation.x = Math.atan2(0.62, Math.max(0.8, hd));
  worker.updateMatrixWorld(true); worker.userData.tip.getWorldPosition(tip);
  worker.position.set(px, worker.position.y, pz); worker.rotation.y = pf; worker.userData.wand.rotation.x = pw;
  if (hd > (G.nozzle === 'jet' ? 5.6 : 3.4) || (hd < 0.75 && ty < GY + 0.02)) return false;
  sdir.set(tx - tip.x, ty - tip.y, tz - tip.z).normalize();
  const r = castSpray(tip, sdir, tip.distanceTo(_v4.set(tx, ty, tz)) + 0.3);
  if (!r.hit || r.hit.kind === 'obs') return false;
  hitP.copy(tip).addScaledVector(sdir, r.t);
  return hitP.distanceTo(_v4.set(tx, ty, tz)) < 0.12;
}
window.__wash = { canHit, collide: (x, z) => { const v = new V3(x, 0, z); collide(v, 0.36); return Math.hypot(v.x - x, v.z - z) < 1e-4; }, G, get L() { return L; }, LEVELS, save, step, startLevel, toMenu, totals, input, sprayUpdate, setNozzle, aimPt, worker: () => worker, critters, finishLevel, persist };
</script>
