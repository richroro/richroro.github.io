<script>
'use strict';
/* ============================================================
   Dungeon Rush · 던전 러시
   HTML 한 파일, 외부 에셋 없음. 그림·효과음 전부 코드로 만든다.
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, LT = 372, LB = 512, GY = 340;   // 화면, 길(레인) 위·아래, 지평선
const Q = new URLSearchParams(location.search);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sgn = v => v < 0 ? -1 : 1;
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const OUT = '#1c1424';

if (!CanvasRenderingContext2D.prototype.roundRect) {

}

/* ---------------- 소리 (Web Audio 합성) ---------------- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();

}
function tone(f, d, type = 'square', vol = .07, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);

}

  if (muted || !AC) return;
  const n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
const SFX = {
  swing() { noise(.09, .05, 3000); tone(300, .08, 'sawtooth', .03, -150); },
  hit() { noise(.09, .14, 1400); tone(150, .09, 'square', .07, -80); },
  heavy() { noise(.22, .22, 800); tone(90, .2, 'sawtooth', .1, -50); },
  arrow() { tone(900, .08, 'triangle', .05, -500); },
  orb() { tone(400, .18, 'sine', .07, 500); },
  zap() { noise(.3, .2, 5000); tone(1200, .25, 'sawtooth', .07, -900); },
  heal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'sine', .07, 0, i * .07)); },
  down() { tone(300, .5, 'sawtooth', .08, -240); },
  coin() { tone(988, .06, 'square', .05); tone(1319, .12, 'square', .05, 0, .06); },
  meat() { tone(440, .1, 'triangle', .07, 300); },
  roar() { noise(.7, .25, 500); tone(70, .7, 'sawtooth', .13, -25); },
  fire() { noise(.5, .16, 1200); },
  boom() { noise(.35, .28, 500); tone(60, .3, 'sine', .15, -30); },
  dodge() { noise(.12, .05, 2500); },
  ui() { tone(660, .06, 'square', .05); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .3, 'square', .06, 0, i * .12)); },
};

/* ---------------- 데이터 ---------------- */
const HD = {
  warrior: { name: '워리어', role: '근접 · 탱커', desc: '3단 콤보 · 회전 베기', hp: 190, spd: 2.5, reach: 62, ranged: false, scd: 420, skillR: 100,
             col: '#d9483b', ico: '⚔', skillName: '회오리 베기' },
  archer:  { name: '아처', role: '원거리 · 딜러', desc: '연사 · 화살 비', hp: 115, spd: 3.0, reach: 0, ranged: true, scd: 480, skillR: 300,
             col: '#4fae7d', ico: '➶', skillName: '화살 비' },
  wizard:  { name: '위저드', role: '마법 · 광역', desc: '마법탄 · 낙뢰', hp: 105, spd: 2.6, reach: 0, ranged: true, scd: 540, skillR: 400,
             col: '#7c4dff', ico: '✦', skillName: '낙뢰' },
  cleric:  { name: '클레릭', role: '지원 · 힐러', desc: '철퇴 · 치유의 빛', hp: 155, spd: 2.7, reach: 56, ranged: false, scd: 780, skillR: 110,
             col: '#f2c14e', ico: '✚', skillName: '치유의 빛' },
};
const TYPES = ['warrior', 'archer', 'wizard', 'cleric'];
const ET = {
  g: { name: '고블린',   hp: 36,  spd: 1.7, dmg: 7,  reach: 38, wind: 22, rec: 26, cd: 50, w: 16, s: 0.85, score: 100 },
  s: { name: '창병',     hp: 60,  spd: 1.4, dmg: 11, reach: 84, wind: 28, rec: 30, cd: 70, w: 18, s: 1.0,  score: 180 },
  h: { name: '샤먼',     hp: 42,  spd: 1.3, dmg: 10, reach: 0,  wind: 30, rec: 30, cd: 110, w: 16, s: 0.9, score: 220, ranged: true },
  o: { name: '오크',     hp: 230, spd: 1.0, dmg: 24, reach: 70, wind: 40, rec: 44, cd: 90, w: 30, s: 1.45, armor: true, score: 600 },
  D: { name: '레드 드래곤', hp: 1700, spd: 0, dmg: 0, reach: 0, w: 72, s: 1, score: 5000, boss: true, armor: true },
};
const STAGES = [
  { name: '불타는 마을', en: 'BURNING VILLAGE', theme: 'village', arenas: [
    { at: 0,    waves: [['g', 'g', 'g'], ['g', 'g', 's']] },
    { at: 820,  waves: [['g', 'g', 's', 's'], ['g', 'g', 'h', 'g']] },
    { at: 1640, waves: [['o', 'g', 'g'], ['s', 's', 'h', 'g', 'g']] }] },
  { name: '고블린 지하 감옥', en: 'GOBLIN DUNGEON', theme: 'dungeon', arenas: [
    { at: 0,    waves: [['g', 'g', 's', 'h'], ['s', 's', 'g', 'g', 'g']] },
    { at: 820,  waves: [['o', 'g', 'g', 'h'], ['o', 's', 's']] },
    { at: 1640, waves: [['s', 's', 'h', 'h', 'g', 'g'], ['o', 'o']] }] },
  { name: '드래곤 둥지', en: 'DRAGON LAIR', theme: 'lair', arenas: [
    { at: 0,    waves: [['g', 'g', 'g', 's', 's'], ['h', 'h', 'o']] },
    { at: 820,  waves: [['o', 'o', 's', 's'], ['g', 'g', 'g', 'g', 'h', 'h']] },
    { at: 1640, waves: [['D']] }] },
];
const DIFFS = [{ n: '쉬움', hp: .75, dmg: .7 }, { n: '보통', hp: 1, dmg: 1 }, { n: '어려움', hp: 1.35, dmg: 1.3 }];

/* ---------------- 입력 ---------------- */
const KEYS = {
  kb1: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', atk: 'KeyJ', skill: 'KeyK', dodge: 'KeyL' },
  kb2: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', atk: 'Comma', skill: 'Period', dodge: 'Slash' },
};
const down = new Set();
const touch = { mx: 0, my: 0, atk: false, skill: false, dodge: false };
const SRC = [
  { id: 'kb1', label: 'P1 키보드', joined: true, slot: -1 },
  { id: 'kb2', label: 'P2 키보드', joined: false, slot: -1 },
  { id: 'pad0', label: '패드 1', joined: false, slot: -1 }, { id: 'pad1', label: '패드 2', joined: false, slot: -1 },
  { id: 'pad2', label: '패드 3', joined: false, slot: -1 }, { id: 'pad3', label: '패드 4', joined: false, slot: -1 },
];
SRC.forEach(s => { s.prev = { atk: false, skill: false, dodge: false, start: false, l: false, r: false }; s.inp = mkInp(); });
function mkInp() { return { mx: 0, my: 0, atk: false, atkHeld: false, skill: false, dodge: false, start: false, l: false, r: false, face: 0 }; }

addEventListener('keydown', e => {
  ac();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  down.add(e.code);
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Enter' || e.code === 'Space') menuKey();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); if (G.scene === 'play') G.paused = true; });

function readSources() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const s of SRC) {
    const i = s.inp, prev = s.prev; let mx = 0, my = 0, atk = false, skill = false, dodge = false, start = false;
    if (s.id[0] === 'k') {
      const K = KEYS[s.id];
      mx = (down.has(K.right) ? 1 : 0) - (down.has(K.left) ? 1 : 0);
      my = (down.has(K.down) ? 1 : 0) - (down.has(K.up) ? 1 : 0);
      atk = down.has(K.atk); skill = down.has(K.skill); dodge = down.has(K.dodge);
      if (s.id === 'kb1') {
        mx = clamp(mx + touch.mx, -1, 1); my = clamp(my + touch.my, -1, 1);
        atk = atk || touch.atk; skill = skill || touch.skill; dodge = dodge || touch.dodge;
      }
    } else {
      const p = pads[+s.id[3]];
      if (p) {
        const b = k => p.buttons[k] && p.buttons[k].pressed;
        mx = Math.abs(p.axes[0]) > .25 ? p.axes[0] : 0; my = Math.abs(p.axes[1]) > .25 ? p.axes[1] : 0;
        if (b(14)) mx = -1; if (b(15)) mx = 1; if (b(12)) my = -1; if (b(13)) my = 1;
        atk = b(0) || b(5) || b(7); skill = b(2) || b(3) || b(4) || b(6); dodge = b(1); start = b(9);
        if (!s.joined && !s.padSeen && (atk || start)) s.padSeen = true;
      }
    }
    i.mx = mx; i.my = my; i.atkHeld = atk;
    i.atk = atk && !prev.atk; i.skill = skill && !prev.skill; i.dodge = dodge && !prev.dodge; i.start = start && !prev.start;
    const L = mx < -.5, R = mx > .5; i.l = L && !prev.l; i.r = R && !prev.r;
    prev.atk = atk; prev.skill = skill; prev.dodge = dodge; prev.start = start; prev.l = L; prev.r = R;
  }
}

/* ---------------- 전체 상태 ---------------- */
const G = {
  scene: 'title', t: 0, cam: 0, lockX: 0, shake: 0, freeze: 0, paused: false,
  heroes: [], enemies: [], projs: [], fx: [], texts: [], items: [], hazards: [], strikes: [],
  stage: 0, ai: 0, phase: 'walk', wi: 0, score: 0, combo: 0, comboT: 0, diff: 1, slotOwner: [null, null, null, null],
  clearT: 0, goT: 0, best: 0, breath: null, ui: [],
};
try { G.best = +localStorage.getItem('dungeonRushBest') || 0; } catch (e) {}
const ex = e => e.x + (e.ox || 0);

/* ---------------- 게임 시작 / 스테이지 ---------------- */
function startGame(stage = 0) {
  G.scene = 'play'; G.score = 0; G.paused = false;
  G.heroes = TYPES.map((type, i) => mkHero(i, type, G.slotOwner[i]));
  loadStage(stage);
  document.body.classList.add('play');
  layout();
}
function mkHero(slot, type, src) {
  const D = HD[type];
  return { k: 'hero', slot, type, src, bot: !src, x: 90 + slot * 34, y: LT + 20 + slot * 34, face: 1, hp: D.hp, max: D.hp, state: 'idle', t: 0,
    anim: 0, cd: 0, scd: 120, dcd: 0, combo: 0, buf: 0, inv: 0, flash: 0, vx: 0, atkT: 0, dur: 0, hitAt: 0, revive: 0, score: 0, kills: 0, idleT: 0, w: 14, botT: 0 };
}
function loadStage(i) {
  G.stage = i; G.cam = 0; G.ai = 0; G.phase = 'walk'; G.wi = 0; G.lockX = STAGES[i].arenas[0].at;
  G.enemies = []; G.projs = []; G.fx = []; G.texts = []; G.items = []; G.hazards = []; G.strikes = []; G.breath = null; G.goT = 0;
  G.heroes.forEach((h, k) => {
    h.x = 90 + k * 34; h.y = LT + 20 + k * 34; h.state = 'idle'; h.vx = 0; h.inv = 60; h.scd = 120;
    if (h.hp <= 0 || h.dead) { h.hp = h.max * .5; h.dead = false; }
    else h.hp = Math.min(h.max, h.hp + h.max * .3);
  });
  G.banner = { t: 150, a: STAGES[i].en, b: `STAGE ${i + 1} · ${STAGES[i].name}` };
}

/* ---------------- 피해 처리 ---------------- */
function num(x, y, s, col, big) { G.texts.push({ x: x + rand(-8, 8), y, s: String(s), col, big, t: 0, max: 46 }); }
function spark(x, y, n, col, sp = 4) {
  for (let i = 0; i < n; i++) G.fx.push({ k: 'p', x, y, vx: rand(-sp, sp), vy: rand(-sp, sp * .3) - 1, t: 0, max: rand(12, 26), col, r: rand(1.5, 3.5), g: .3 });
}
function ring(x, y, r0, r1, col, max = 18) { G.fx.push({ k: 'ring', x, y, r0, r1, col, t: 0, max }); }
function boom(x, y, r, col = '#ffb347') { ring(x, y, r * .3, r, col, 16); spark(x, y - 10, 16, col, 5); SFX.boom(); G.shake = Math.max(G.shake, 6); }

function hurtE(e, dmg, src, kb, stun, heavy) {
  if (e.state === 'dying') return;
  const crit = Math.random() < .12; if (crit) dmg = Math.round(dmg * 1.6);
  e.hp -= dmg; e.flash = 6;
  if (src && src.k === 'hero') { src.score += dmg; G.score += dmg; }
  num(ex(e), e.y - 62 * (ET[e.type].s || 1), dmg, crit ? '#ffd23c' : '#fff', crit);
  spark(ex(e), e.y - 30, 6, '#fff3c4', 3);
  G.comboT = 150; G.combo++;
  (heavy ? SFX.heavy : SFX.hit)();
  if (heavy) { G.shake = Math.max(G.shake, 5); G.freeze = 3; }
  if (e.hp <= 0) return killE(e, src);
  if (!ET[e.type].armor || stun >= 26) {
    if (e.type !== 'D') { e.state = 'hurt'; e.t = stun; e.vx = kb * (src ? sgn(e.x - src.x) : 1); }
  } else if (kb) e.vx = kb * .3 * (src ? sgn(e.x - src.x) : 1);
}
function killE(e, src) {
  const T = ET[e.type];
  e.state = 'dying'; e.t = 0; e.vx = (src ? sgn(e.x - src.x) : 1) * 5;
  G.score += T.score; if (src && src.k === 'hero') { src.score += T.score; src.kills++; }
  spark(ex(e), e.y - 30, 14, '#ffe27a', 5);
  if (T.boss) { G.freeze = 12; G.shake = 16; SFX.roar(); SFX.boom(); }
  const r = Math.random();
  if (r < .16 || (T.armor && !T.boss)) G.items.push({ t: 'meat', x: e.x, y: e.y, life: 900 });
  else if (r < .55) G.items.push({ t: 'coin', x: e.x, y: e.y, life: 600 });
}
function hurtH(h, dmg, fromX, kb, stun) {
  if (h.state === 'down' || h.inv > 0 || h.state === 'dodge') return false;
  dmg = Math.max(1, Math.round(dmg * DIFFS[G.diff].dmg * (1 + G.stage * .14)));
  h.hp -= dmg; h.flash = 6; G.comboT = Math.min(G.comboT, 60);

        ctx.beginPath(); ctx.moveTo(x0 + Math.sin(f.seed) * 30, -10);

    }
    else if (f.k === 'name') { ctx.globalAlpha = 1 - p * p; txt(f.s, f.x - cx, f.y - p * 24, 22, f.col); ctx.globalAlpha = 1; }
  }
  for (const t of G.texts) { const p = t.t / t.max; ctx.globalAlpha = 1 - p * p; const sc = t.big ? 1.4 : 1; txt(t.s, t.x - cx, t.y, (t.big ? 30 : 22) * (t.t < 6 ? 1 + (6 - t.t) * .06 : 1), t.col, 'center', '#1c1424', 5); ctx.globalAlpha = 1; }
  drawEmbers(theme);
}
function labelOf(h) { return h.src ? h.src.id === 'kb1' ? 'P1' : h.src.id === 'kb2' ? 'P2' : 'PAD' + (+h.src.id[3] + 1) : 'COM'; }

function drawHUD() {
  for (const h of G.heroes) {
    const D = HD[h.type], i = h.slot, x = 10 + i * 158, y = 8;
    ctx.fillStyle = 'rgba(14,8,22,.72)'; ctx.beginPath(); ctx.roundRect(x, y, 150, 50, 10); ctx.fill();
    ctx.strokeStyle = h.state === 'down' ? '#ff6b6b' : D.col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = D.col; ctx.beginPath(); ctx.arc(x + 24, y + 25, 17, 0, 7); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();

    txt('GO', W - 90, H / 2 - 30, 40, '#ffd23c'); ctx.fillStyle = '#ffd23c'; ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W - 50, H / 2 - 30); ctx.lineTo(W - 74, H / 2 - 50); ctx.lineTo(W - 74, H / 2 - 10); ctx.closePath(); ctx.stroke(); ctx.fill();

/* ---------------- 메뉴 화면 ---------------- */
function btn(x, y, w, h, label, cb, col = '#e0453b', size = 24) {

function drawTitle() {
  const cam = G.t * .6; drawBG('village', cam);

}
function toSelect() {
  ac(); SFX.ui(); G.scene = 'select'; G.t = 0;
  SRC.forEach(s => { if (s.id === 'kb1') s.joined = true; });
  G.slotOwner = [null, null, null, null];
  SRC.forEach(s => { s.slot = -1; });

  SRC.forEach(s => { if (s.id !== 'kb1') s.joined = false; });
}
function firstFree() { return G.slotOwner.findIndex(o => !o); }
function moveSlot(s, dir) {
  let i = s.slot; for (let k = 0; k < 4; k++) { i = (i + dir + 4) % 4; if (!G.slotOwner[i] || G.slotOwner[i] === s) break; }
  if (G.slotOwner[i] && G.slotOwner[i] !== s) return;
  G.slotOwner[s.slot] = null; s.slot = i; G.slotOwner[i] = s; SFX.ui();
}
function updateSelect() {
  for (const s of SRC) {
    const i = s.inp;
    if (!s.joined) { if (i.atk || i.start) { const f = firstFree(); if (f >= 0) { s.joined = true; s.slot = f; G.slotOwner[f] = s; SFX.ui(); } } continue; }
    if (i.l) moveSlot(s, -1); if (i.r) moveSlot(s, 1);
    if (s.id !== 'kb1' && i.dodge) { s.joined = false; G.slotOwner[s.slot] = null; s.slot = -1; SFX.ui(); }
    if (i.start && s.id.startsWith('pad')) startGame(+Q.get('stage') || 0);

}
function drawSelect() {
  drawBG('village', 200 + Math.sin(G.t * .005) * 40);

    const D = HD[t], x = 40 + i * 226, y = 100, w = 206, h = 268, owner = G.slotOwner[i];
    ctx.fillStyle = owner ? 'rgba(40,24,64,.95)' : 'rgba(24,14,38,.9)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill();
    ctx.strokeStyle = owner ? D.col : '#4a3a66'; ctx.lineWidth = owner ? 5 : 2.5; ctx.stroke();
    G.ui.push({ x, y, w, h, cb: () => { const s = SRC[0]; if (G.slotOwner[i] && G.slotOwner[i] !== s) return; if (s.slot === i) return; G.slotOwner[s.slot] = null; s.slot = i; G.slotOwner[i] = s; SFX.ui(); } });
    const h2 = { type: t, slot: i, face: 1, state: G.t % 120 < 40 && owner ? 'atk' : 'idle', atkT: (G.t % 120) % 40, dur: 40, ci: 0, anim: 0, inv: 0, flash: 0, idle: true };
    if (h2.state === 'atk') { h2.atkT = (G.t % 40); }
    drawHero(h2, x + w / 2, y + 168, true);
    txt(D.name, x + w / 2, y + 196, 26, '#fff'); txt(D.role, x + w / 2, y + 220, 14, D.col, 'center', '#000', 3); txt(D.desc, x + w / 2, y + 240, 13, '#cfc3e8', 'center', '#000', 3);
    const lab = owner ? (owner.id === 'kb1' ? (TOUCH ? '나' : 'P1') : owner.id === 'kb2' ? 'P2' : 'PAD ' + (+owner.id[3] + 1)) : 'COM';
    ctx.fillStyle = owner ? D.col : '#3a2f52'; ctx.beginPath(); ctx.roundRect(x + w / 2 - 34, y + 12, 68, 26, 13); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
    txt(lab, x + w / 2, y + 26, 15, '#fff', 'center', null);
  });
  btn(40, 400, 210, 54, '난이도 · ' + DIFFS[G.diff].n, () => { G.diff = (G.diff + 1) % 3; SFX.ui(); }, '#3f7fc4', 20);
  btn(W / 2 - 150, 396, 300, 72, '출발!', () => startGame(+Q.get('stage') || 0), '#e0453b', 40);
  btn(W - 250, 400, 210, 54, '뒤로', () => { G.scene = 'title'; SFX.ui(); }, '#6b6170', 20);
  txt(TOUCH ? '' : 'P1  WASD 이동 · J 공격 · K 스킬 · L 구르기      P2  방향키 · , 공격 · . 스킬 · / 구르기', W / 2, 496, 14, '#ffd9a0', 'center', '#000', 4);
  txt(TOUCH ? '' : 'Enter / Space 로 출발 · P 일시정지 · M 소리', W / 2, 518, 13, '#cfc3e8', 'center', '#000', 4);
}
function menuKey() {
  if (G.scene === 'title') toSelect();
  else if (G.scene === 'select') startGame(+Q.get('stage') || 0);
  else if (G.scene === 'over' && G.goT > 40) { startGame(G.stage); }
  else if (G.scene === 'victory' && G.goT > 40) { G.scene = 'title'; document.body.classList.remove('play'); }
  else if (G.scene === 'play' && G.paused) G.paused = false;
}
function togglePause() { if (G.scene === 'play') G.paused = !G.paused; }

function overlayBox(title, sub, col) {

  txt(title, W / 2, 170, 76, col, 'center', '#1c1424', 12); if (sub) txt(sub, W / 2, 232, 24, '#fff', 'center', '#000', 5);
}
function drawResults(y0) {
  G.heroes.forEach((h, i) => {
    const D = HD[h.type], x = 90 + i * 200;
    ctx.fillStyle = 'rgba(30,18,50,.85)'; ctx.beginPath(); ctx.roundRect(x - 10, y0, 180, 96, 12); ctx.fill(); ctx.strokeStyle = D.col; ctx.lineWidth = 3; ctx.stroke();
    txt(D.name + (h.bot ? '' : ' · ' + labelOf(h)), x + 80, y0 + 16, 16, '#fff', 'center', '#000', 3);

}
function drawScenePlay() {
  const sh = G.shake;
  ctx.save(); if (sh > .3) ctx.translate(rand(-sh, sh), rand(-sh, sh));
  drawWorld(G.cam); ctx.restore();
  drawHUD();
  if (G.scene === 'clear') {

  }

    if (G.goT > 40) btn(W / 2 - 110, 468, 220, 52, '타이틀로', () => menuKey(), '#3f7fc4', 22);
  }
  if (G.scene === 'over') {

  }
  if (G.paused && G.scene === 'play') {
    ctx.fillStyle = 'rgba(8,4,14,.72)'; ctx.fillRect(0, 0, W, H);
    txt('일시정지', W / 2, 150, 58, '#ffd23c');
    btn(W / 2 - 120, 210, 240, 56, '계속하기', () => { G.paused = false; }, '#4fae7d', 24);
    btn(W / 2 - 120, 282, 240, 56, '다시 시작', () => startGame(G.stage), '#3f7fc4', 24);
    btn(W / 2 - 120, 354, 240, 56, '타이틀로', () => { G.scene = 'title'; G.paused = false; document.body.classList.remove('play'); }, '#6b6170', 24);
    txt(TOUCH ? '' : 'P / Esc 계속 · M 소리 ' + (muted ? '켜기' : '끄기'), W / 2, 440, 15, '#cfc3e8', 'center', '#000', 4);
  }

/* ---------------- 루프 ---------------- */
function step() {
  readSources();
  if (G.scene === 'title') { G.t++; if (Q.has('auto')) { toSelect(); startGame(+Q.get('stage') || 0); } }
  else if (G.scene === 'select') { G.t++; updateSelect(); }
  else if (G.scene === 'play') { if (!G.paused) updatePlay(); }
  else if (G.scene === 'clear') {
    G.clearT++; G.t++; updatePlay2();
    if (G.clearT > 260) {
      if (G.stage + 1 < STAGES.length) { G.scene = 'play'; G.heroes.forEach(h => h.inv = 0); loadStage(G.stage + 1); }
      else { G.scene = 'victory'; G.goT = 0; try { if (G.score > G.best) { G.best = G.score; localStorage.setItem('dungeonRushBest', G.best); } } catch (e) {} }
    }
  } else if (G.scene === 'victory' || G.scene === 'over') { G.goT++; G.t++; G.heroes.forEach(h => { if (G.scene === 'victory' && h.state !== 'down') { h.state = 'idle'; } });
    for (const h of G.heroes) { if (h.flash > 0) h.flash--; } if (G.scene === 'over') { G.enemies.forEach(updEnemy); } }
  for (const s of SRC) s.inp.atk = s.inp.skill = s.inp.dodge = s.inp.start = false;
}
function updatePlay2() { // 클리어 연출 동안 이펙트만 굴린다
  for (let i = G.fx.length - 1; i >= 0; i--) { const f = G.fx[i]; f.t++; if (f.k === 'p') { f.x += f.vx; f.y += f.vy; f.vy += f.g; } if (f.t >= f.max) G.fx.splice(i, 1); }
  for (let i = G.texts.length - 1; i >= 0; i--) { const t = G.texts[i]; t.t++; t.y -= .7; if (t.t >= t.max) G.texts.splice(i, 1); }
  G.enemies.forEach(updEnemy); G.enemies = G.enemies.filter(e => !e.dead); if (G.shake > 0) G.shake *= .86;
}
function render() {
  G.ui = [];
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.lineWidth = 2.5; ctx.strokeStyle = OUT; ctx.globalAlpha = 1;
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'select') drawSelect();
  else drawScenePlay();
  if (muted) txt('MUTE', 12, H - 14, 12, '#ffd23c', 'left', '#000', 3);
}
let last = 0, acc = 0, RS = 1;
function frame(ts) {
  const dt = Math.min(100, ts - last || 16.7); last = ts; acc += dt;
  let n = 0; const fast = +Q.get('fast') || 1;
  while (acc >= 16.667 && n < 5 * fast) { for (let k = 0; k < fast; k++) step(); acc -= 16.667; n++; }
  if (acc > 100) acc = 0;
  render(); requestAnimationFrame(frame);
}

/* ---------------- 화면 배치·터치 ---------------- */
function layout() {
  const vw = innerWidth, vh = innerHeight, portrait = vh > vw * 1.05;
  document.body.classList.toggle('portrait', portrait);
  let cw, ch;
  if (portrait) { cw = vw; ch = vw * 9 / 16; } else { cw = Math.min(vw, vh * 16 / 9); ch = cw * 9 / 16; }
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = (vw - cw) / 2 + 'px'; cv.style.top = portrait ? Math.min(44, Math.max(0, (vh - ch) * .06)) + 'px' : (vh - ch) / 2 + 'px';
  RS = clamp(cw * (devicePixelRatio || 1) / W, 1, 2);
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  const joy = document.getElementById('joy'), top = parseFloat(cv.style.top) + ch;
  joy.style.height = portrait ? Math.max(120, vh - top) + 'px' : '68%';
  document.getElementById('bAtk').style.bottom = portrait ? '30px' : '26px';
}
addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 200));
cv.addEventListener('pointerdown', e => {
  ac();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (let i = G.ui.length - 1; i >= 0; i--) { const b = G.ui[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.ui(); b.cb(); return; } }
  if (G.scene === 'title') toSelect();
  else if (G.scene === 'play' && G.paused) G.paused = false;
});
// 가상 조이스틱과 버튼
(function () {
  const joy = document.getElementById('joy'), kb = document.getElementById('knobBase'), kn = document.getElementById('knob');
  let id = null, ox = 0, oy = 0;
  joy.addEventListener('pointerdown', e => { ac(); id = e.pointerId; joy.setPointerCapture(id); ox = e.clientX; oy = e.clientY; kb.style.display = kn.style.display = 'block'; kb.style.left = kn.style.left = ox + 'px'; kb.style.top = kn.style.top = oy + 'px'; e.preventDefault(); });
  joy.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return; let dx = e.clientX - ox, dy = e.clientY - oy; const l = Math.hypot(dx, dy), m = 46;
    if (l > m) { dx = dx / l * m; dy = dy / l * m; }
    kn.style.left = ox + dx + 'px'; kn.style.top = oy + dy + 'px';
    touch.mx = Math.abs(dx) > 8 ? dx / m : 0; touch.my = Math.abs(dy) > 8 ? dy / m : 0;
  });
  const end = e => { if (e.pointerId !== id) return; id = null; touch.mx = touch.my = 0; kb.style.display = kn.style.display = 'none'; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  const hold = (el, key) => {
    el.addEventListener('pointerdown', e => { ac(); touch[key] = true; el.classList.add('on'); el.setPointerCapture(e.pointerId); e.preventDefault(); });
    const up = () => { touch[key] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  };
  hold(document.getElementById('bAtk'), 'atk'); hold(document.getElementById('bSkill'), 'skill'); hold(document.getElementById('bDodge'), 'dodge');
  document.getElementById('bPause').addEventListener('pointerdown', e => { togglePause(); e.preventDefault(); });
})();
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') G.paused = true; });

layout();
if (document.fonts && document.fonts.load) document.fonts.load('20px "Black Han Sans"').catch(() => {});
window.__G = G; window.__startGame = startGame;
requestAnimationFrame(frame);
